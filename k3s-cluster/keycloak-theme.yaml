# ==============================================================================
# ARQUIVO: k3s-cluster/keycloak-theme.yaml
# ------------------------------------------------------------------------------
# OBJETIVO
#   Tema visual customizado ("prefeitura") para a tela de login do Keycloak
#   — troca o logo e a cor principal (botão de login, links) pela
#   identidade visual da Prefeitura de Rondonópolis-MT, sem precisar de
#   uma imagem Docker customizada (o tema é injetado via ConfigMap,
#   montado direto na imagem oficial do Keycloak).
#
# ✅ ESTADO ATUAL: TEMA COMPLETO — COR E LOGO REAIS APLICADOS
#   1. Cor institucional (`#0571EE`): extraída de verdade do CSS/HTML de
#      https://www.rondonopolis.mt.gov.br/, não estimada.
#   2. Logo (brasão + "PREFEITURA DE RONDONÓPOLIS"): o arquivo enviado veio
#      em branco/monocromático com fundo cinza SÓLIDO (sem transparência)
#      — processado (máscara de luminância via PowerShell/.NET, ver seção
#      "LOGO" mais abaixo neste arquivo para o passo a passo completo) para
#      virar um PNG branco-sobre-transparente de verdade, montado sobre
#      uma faixa da cor institucional no CSS (senão ficaria invisível de
#      novo sobre um fundo claro).
#
# COMO DESCOBRIMOS A ESTRUTURA CERTA (não foi adivinhado)
#   O tema padrão do Keycloak 26 ("keycloak.v2") NÃO tem uma imagem de
#   logo — usa só texto (o "Display name" do Realm). Extraímos o JAR real
#   de dentro do Pod em execução
#   (`/opt/keycloak/lib/lib/main/org.keycloak.keycloak-themes-26.0.8.jar`)
#   e confirmamos, no `template.ftl` e no `styles.css` REAIS:
#     - O texto do cabeçalho fica em `<div id="kc-header-wrapper"
#       class="pf-v5-c-brand">` — por isso usamos esse mesmo seletor CSS
#       para sobrepor um logo via `background-image`.
#     - A cor do botão de login vem, através de uma cadeia de variáveis
#       CSS do PatternFly 5, de `--pf-v5-global--primary-color--100`
#       (confirmado rastreando `.pf-v5-c-button.pf-m-primary` até a
#       variável raiz no CSS vendorizado real).
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme-prefeitura
  namespace: authentication

data:
  # ----------------------------------------------------------------------
  # theme.properties — o "manifesto" do tema: de qual tema base ele herda
  # (tudo que não sobrescrevemos aqui continua igual ao padrão) e quais
  # arquivos CSS adicionais carregar.
  # ----------------------------------------------------------------------
  theme.properties: |
    parent=keycloak.v2
    # ↑ Herda TUDO do tema novo padrão do Keycloak 26 (layout, textos,
    #   comportamento) — nosso tema só ADICIONA um CSS por cima, não
    #   reescreve nada estruturalmente. Muito mais seguro/fácil de manter
    #   do que copiar e modificar os templates inteiros.

    styles=css/custom.css
    # ↑ Carrega nosso CSS customizado DEPOIS do CSS padrão do tema pai —
    #   por isso nossas regras conseguem sobrescrever as dele (CSS mais
    #   específico/mais recente na ordem de carregamento vence).

  # ----------------------------------------------------------------------
  # custom.css — cores e logo da prefeitura (a preencher)
  # ----------------------------------------------------------------------
  custom.css: |
    /* ==========================================================
       Tema da Prefeitura de Rondonópolis-MT — tela de login
       ==========================================================
       Status: ESQUELETO — ainda sem cor/logo reais aplicados.
       Ver o cabeçalho de k3s-cluster/keycloak-theme.yaml para o
       porquê de cada seletor usado abaixo ter sido escolhido. */

    /* --- Cor institucional principal (botão de login, links) -----------
       Valor REAL, não estimado: extraído direto do CSS/HTML servido por
       https://www.rondonopolis.mt.gov.br/ (curl no HTML + nas 3 folhas de
       estilo do site oficial, contando ocorrências de cada cor hex) —
       #0571EE é a cor de destaque mais usada no site (22 ocorrências no
       CSS + 7 no HTML), claramente o azul institucional. Sobrescrevemos
       as 3 variantes (base, light, dark) porque o CSS do PatternFly usa
       uma ou outra dependendo do contexto (fundo claro vs escuro da
       página) — sobrescrever só uma deixaria a outra com a cor azul
       padrão do Keycloak em algum estado (ex.: modo escuro do SO). */
    :root {
      --pf-v5-global--primary-color--100: #0571EE;
      --pf-v5-global--primary-color--light-100: #0571EE;
      --pf-v5-global--primary-color--dark-100: #0571EE;
    }

    /* --- Logo da prefeitura no lugar do texto "KEYCLOAK" ----------------
       O arquivo enviado (brasão + "PREFEITURA DE RONDONÓPOLIS") veio em
       branco/monocromático, sem transparência (fundo cinza bem claro
       sólido, #F7F7F7) — inútil sobre o fundo claro do card de login como
       estava. Processado (fora deste arquivo, ver histórico do commit):
       o fundo uniforme foi convertido em transparência real via máscara
       de luminância (247 = transparente, 255 = branco opaco), o que
       funciona bem aqui porque a imagem original é essencialmente
       bicolor. Resultado: logo branco de verdade sobre fundo transparente
       — por isso a faixa AZUL abaixo (`background-color`, a mesma cor
       institucional de cima) é OBRIGATÓRIA: sem ela, o logo branco fica
       invisível de novo sobre o fundo claro do tema padrão. */
    #kc-header-wrapper {
      background-color: #0571EE;
      background-image: url(../img/logo.png);
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      min-height: 90px;
      /* ↑ Maior que o padrão de exemplo (70px) — o logo é bem mais LARGO
         que alto (proporção ~2,6:1, com texto pequeno "PREFEITURA DE" no
         topo), então precisa de mais altura pra esse texto continuar
         legível em vez de espremido. Ajuste conforme o resultado visual
         real (ver o Pod rodando) se achar grande/pequeno demais. */
      border-radius: 4px;
      text-indent: -9999px;
      overflow: hidden;

      width: 100%;
    }

    /* --- FIX: logo ia para o canto superior direito em tela maximizada -
       CAUSA RAIZ CONFIRMADA (não é chute — inspecionamos ao vivo o CSS
       real servido pelo Pod via `kubectl exec` + `curl` direto no
       Keycloak, ago/2026): o PatternFly 5 (base do tema `keycloak.v2`)
       define, no próprio `patternfly.min.css` do Keycloak:

         @media (min-width: 1200px) {
           .pf-v5-c-login__container {
             display: grid;
             grid-template-areas: "main header" "main footer" "main .";
             grid-template-columns: 34rem minmax(auto, 34rem);
           }
         }
         .pf-v5-c-login__header { grid-area: header; }

       Ou seja: abaixo de 1200px de largura, `.pf-v5-c-login__container`
       nem é grid — os filhos (`header` > `#kc-header-wrapper`, `main`,
       `footer`) simplesmente empilham na ordem do HTML, por isso a tela
       normal/mobile sempre pareceu certa. Só a partir de 1200px (tela
       maximizada em qualquer monitor comum) o PatternFly troca pra um
       grid de 2 colunas pensado pra um layout "card de login + imagem
       lateral" — a coluna 1 (34rem) é o `main` (o card), e a coluna 2 é
       reservada pro `header`/`footer`, empurrando nosso logo pro canto
       superior direito, do lado do card, em vez de ficar como faixa no
       topo. Não é bug nosso nem do tema — é um layout alternativo do
       PatternFly que a prefeitura não pediu.
       FIX: desliga esse grid de 2 colunas em qualquer largura de tela,
       voltando ao empilhamento simples (header no topo, depois main,
       depois footer) que já funciona certo abaixo de 1200px. */
    @media (min-width: 1200px) {
      .pf-v5-c-login__container {
        display: block !important;
      }
    }

binaryData:
  # ----------------------------------------------------------------------
  # logo.png — brasão + "PREFEITURA DE RONDONÓPOLIS", processado a partir
  # do arquivo enviado (fundo cinza sólido convertido em transparência
  # real via máscara de luminância — ver comentário no custom.css acima).
  # ----------------------------------------------------------------------
  logo.png: 

# ==============================================================================
# LOGO: JÁ APLICADO (ver commit correspondente) — resumo do que foi feito
#   1. Arquivo original (`logo-prefeitura.png.jpeg`, enviado no chat) tinha
#      fundo cinza-claro SÓLIDO (#F7F7F7), sem transparência — inútil como
#      estava sobre o fundo claro do tema padrão do Keycloak.
#   2. Processado com PowerShell + .NET System.Drawing (sem precisar
#      instalar ImageMagick/Python): histograma de cores confirmou a
#      imagem é essencialmente bicolor (fundo ~247,247,247 / logo em
#      branco puro 255,255,255) — por isso uma máscara de luminância
#      simples (247→alpha 0, 255→alpha 255) gerou um recorte limpo, sem
#      precisar de nenhuma ferramenta de remoção de fundo sofisticada.
#   3. Resultado validado visualmente ANTES de aplicar: composto sobre um
#      retângulo `#0571EE` (a mesma cor institucional) pra confirmar que a
#      transparência e a legibilidade do texto pequeno ("PREFEITURA DE")
#      ficaram corretas.
#   4. `binaryData.logo.png` acima = esse PNG processado, em base64.
#   5. `keycloak.yaml` tem o volumeMount correspondente montando esta
#      chave em `/opt/keycloak/themes/prefeitura/login/resources/img/logo.png`.
#
# SE PRECISAR TROCAR O LOGO NO FUTURO:
#   1. Gere o novo PNG (com transparência real, se possível — evita todo
#      o trabalho de máscara de luminância feito aqui).
#   2. `base64 -w0 novo-logo.png` (Linux/Mac/Git Bash) ou `certutil -encode
#      novo-logo.png logo.b64` (PowerShell/CMD puro) e substitua o valor
#      de `binaryData.logo.png` acima.
#   3. git push — a pipeline reaplica o ConfigMap automaticamente, mas
#      como é um ConfigMap montado como volume, o Keycloak só relê o
#      arquivo depois de os Pods serem recriados:
#        kubectl rollout restart deployment/keycloak -n authentication
# ==============================================================================
