# ==============================================================================
# ARQUIVO: k3s-cluster/secrets.yaml
# ------------------------------------------------------------------------------
# OBJETIVO
#   Centralizar TODAS as credenciais sensíveis usadas pela stack:
#     - Usuário/senha do banco PostgreSQL.
#     - Usuário/senha do administrador do Keycloak (o "root" do IdP).
#     - Token de administração do Vaultwarden (protege o painel /admin).
#
# ⚠️  AVISO DE SEGURANÇA — LEIA ANTES DE USAR EM PRODUÇÃO ⚠️
#   Um Kubernetes Secret comum NÃO é criptografado de verdade — os valores
#   ficam apenas em Base64 (ou seja, ofuscados, não protegidos) e, por estarem
#   neste arquivo dentro do repositório Git, QUALQUER pessoa com acesso ao
#   repositório (ou ao histórico de commits) consegue ler as senhas.
#
#   Para uma stack de nível GOVERNAMENTAL, o recomendado de mercado é:
#     1. Bitnami Sealed Secrets  -> criptografa o Secret; só o cluster decifra.
#     2. Mozilla SOPS + idade/GPG -> criptografa o arquivo YAML inteiro no Git.
#     3. External Secrets Operator -> busca os segredos de um cofre externo
#        (HashiCorp Vault, Azure Key Vault, AWS Secrets Manager) em runtime,
#        sem NUNCA versionar segredo nenhum no Git.
#
#   Este arquivo usa valores FICTÍCIOS apenas para o cluster subir funcional
#   no primeiro deploy. TROQUE TODOS OS VALORES antes de expor o sistema para
#   a internet. Veja o passo a passo de troca no final deste arquivo.
#
# ORDEM DE APLICAÇÃO
#   Aplicado logo após o Namespace, e ANTES do PostgreSQL/Keycloak/Vaultwarden,
#   pois os Deployments desses três dependem destas chaves via `secretKeyRef`.
# ==============================================================================

apiVersion: v1
# ↑ API core estável do Kubernetes (mesma família de Namespace, Pod, Service).

kind: Secret
# ↑ Tipo de recurso: um objeto Secret, feito para guardar dados sensíveis
#   (diferente de um ConfigMap, que é para configuração não sensível).

metadata:
  name: auth-stack-credentials
  # ↑ Nome do Secret. Os Deployments (postgres-db.yaml, keycloak.yaml,
  #   vaultwarden.yaml) vão referenciar exatamente este nome em `secretKeyRef.name`.

  namespace: authentication
  # ↑ Este Secret só existe DENTRO do namespace "authentication" — Secrets são
  #   recursos "namespaced" (não são visíveis fora do namespace onde vivem).

  labels:
    app.kubernetes.io/part-of: prefeitura-auth-stack
    # ↑ Mesmo padrão de rótulo usado no Namespace, para agrupamento visual.

type: Opaque
# ↑ "Opaque" é o tipo genérico de Secret do Kubernetes: um conjunto livre de
#   pares chave/valor definidos por nós (diferente de tipos especializados
#   como `kubernetes.io/tls` ou `kubernetes.io/dockerconfigjson`).

# ------------------------------------------------------------------------------
# stringData vs data:
#   - `data`: exige que VOCÊ codifique cada valor em Base64 manualmente antes
#     de colar aqui (ex.: `echo -n "minhasenha" | base64`).
#   - `stringData`: aceita texto puro (mais legível para comentar linha a
#     linha, como pedido). O próprio Kubernetes converte para Base64 e grava
#     dentro de `data` automaticamente no momento em que o objeto é criado.
#   Por legibilidade e didática, usamos `stringData` aqui.
# ------------------------------------------------------------------------------
stringData:

  # --- Credenciais do banco de dados PostgreSQL ------------------------------
  POSTGRES_DB: keycloak
  # ↑ Nome do banco de dados que o Keycloak vai usar para guardar realms,
  #   usuários, grupos, roles e sessões. Criado automaticamente pela imagem
  #   oficial do Postgres na primeira inicialização do container.

  POSTGRES_USER: keycloak_user
  # ↑ Usuário "dono" do banco acima. É diferente do admin do Keycloak (que é
  #   um usuário DENTRO do Keycloak) — este aqui é o usuário do PostgreSQL.
  #   (Nome escolhido para bater com o padrão já usado no Keycloak que hoje
  #   roda fora do K3s nesta prefeitura — mesmo `setup.sh`/`.env`.)

  POSTGRES_PASSWORD: "Tr0c4r@P0stgres-2026-Prefeitura!"
  # ↑ ⚠️ VALOR FICTÍCIO. Senha do usuário acima. Gere uma senha forte real com:
  #   `openssl rand -base64 24` (Linux/Mac) e substitua este valor antes do
  #   primeiro deploy em produção.

  # --- Credenciais do administrador do Keycloak -------------------------------
  KC_BOOTSTRAP_ADMIN_USERNAME: kc_admin
  # ↑ Usuário administrador inicial do Keycloak (login no Master Realm).
  #   ⚠️ NOME DA VARIÁVEL: a partir do Keycloak 26, `KEYCLOAK_ADMIN` foi
  #   descontinuada em favor de `KC_BOOTSTRAP_ADMIN_USERNAME` (confirmado
  #   pelo `.env` do Keycloak que já roda hoje fora do K3s nesta
  #   prefeitura — usamos o MESMO nome de usuário, `kc_admin`, por
  #   consistência entre os dois ambientes). Assim como antes, só tem
  #   efeito na PRIMEIRA inicialização (o Keycloak ignora em boots
  #   seguintes, pois o usuário já existe no banco).

  KC_BOOTSTRAP_ADMIN_PASSWORD: "Tr0c4r@K3ycl04k-2026-Prefeitura!"
  # ↑ ⚠️ VALOR FICTÍCIO. Senha do administrador acima. Troque assim que logar
  #   pela primeira vez, e ative MFA (TOTP) no Keycloak para este usuário.

  # --- Credencial do Vaultwarden ------------------------------------------------
  VAULTWARDEN_ADMIN_TOKEN: "Tr0c4r-Token-Longo-E-Aleatorio-Para-Painel-Admin-Vaultwarden"
  # ↑ Token secreto que protege o painel administrativo do Vaultwarden
  #   (rota /admin — onde é possível gerenciar usuários e configurações do
  #   cofre de senhas). Gere um valor forte real com:
  #   `openssl rand -base64 48`
  #   Sem este token configurado corretamente, o painel /admin fica
  #   inacessível (comportamento seguro por padrão do Vaultwarden).

# ==============================================================================
# COMO TROCAR ESTES VALORES DEPOIS (passo a passo):
#   1. Gere valores fortes:
#        openssl rand -base64 32
#   2. Edite os valores acima neste arquivo (nunca deixe os fictícios em produção).
#   3. Faça commit e push na branch "main" — a pipeline do GitHub Actions
#      (deploy.yml) vai aplicar o novo Secret automaticamente via `kubectl apply`.
#   4. IMPORTANTE: alterar a senha do Postgres AQUI não muda a senha já
#      gravada dentro do banco de dados existente. Você precisa também rodar
#      dentro do Pod do Postgres:
#        kubectl exec -it -n authentication deploy/postgres -- \
#          psql -U keycloak_user -c "ALTER USER keycloak_user WITH PASSWORD 'nova_senha';"
#   5. Depois de trocar qualquer senha, reinicie os Pods que a consomem:
#        kubectl rollout restart deployment/keycloak -n authentication
#        kubectl rollout restart deployment/vaultwarden -n authentication
# ==============================================================================
