# ==============================================================================
# ARQUIVO: k3s-cluster/keycloak.yaml
# ------------------------------------------------------------------------------
# OBJETIVO
#   Subir o Keycloak 26+ (baseado em Quarkus, o "Novo Keycloak") com 2
#   réplicas para alta disponibilidade — se um Pod cair ou for atualizado, o
#   outro continua atendendo login da prefeitura sem interrupção.
#
# RECURSOS DECLARADOS NESTE ARQUIVO (em ordem lógica):
#   1. Service headless    -> dá a cada Pod do Keycloak um registro DNS
#      individual, usado pelo protocolo de clustering (ver abaixo).
#   2. Deployment (2 réplicas) -> os Pods do Keycloak propriamente ditos.
#   3. Service (ClusterIP) -> endereço de rede interno, uso só dentro do cluster.
#   4. Service (LoadBalancer) -> expõe a porta 18443 na VM (mesma porta que
#      o Keycloak antigo já usava), para o Nginx da borda continuar
#      funcionando SEM nenhuma alteração de configuração — ver seção 4.
#
# COMO FUNCIONA O CLUSTERING (histórico de um erro real corrigido aqui)
#   Com 2 réplicas, cada Pod do Keycloak precisa saber da EXISTÊNCIA do outro
#   para sincronizar cache distribuído (sessões de login, tokens revogados,
#   etc.) via Infinispan/JGroups. A primeira versão deste arquivo assumia
#   que `KC_CACHE_STACK=kubernetes` usava o protocolo "KUBE_PING" (consulta
#   à API do Kubernetes) e criava um ServiceAccount+Role+RoleBinding para
#   isso — ERRADO: na prática (confirmado rodando de verdade e vendo o
#   Pod crashar com "dns_query can not be null or empty"), o stack
#   "kubernetes" do Keycloak 26 usa **DNS_PING**, que descobre os outros
#   Pods via consulta DNS a um Service HEADLESS (`clusterIP: None`), não
#   via API do Kubernetes. Por isso este arquivo NÃO tem mais RBAC nenhum
#   (não precisa) — em vez disso, tem o Service headless abaixo, e a
#   variável JAVA_OPTS_APPEND (mais adiante) apontando o DNS_PING para ele.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1) Service headless — dá um registro DNS individual a cada Pod do Keycloak
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: keycloak-headless
  namespace: authentication
  labels:
    app: keycloak

spec:
  clusterIP: None
  # ↑ Isso é o que torna este Service "headless": em vez de um único IP
  #   virtual (ClusterIP normal), uma consulta DNS a este nome retorna
  #   DIRETAMENTE os IPs de TODOS os Pods que casarem com o selector
  #   abaixo — exatamente o que o protocolo DNS_PING do JGroups precisa
  #   para descobrir os outros Pods do Keycloak e formar o cluster.

  publishNotReadyAddresses: true
  # ↑ Por padrão, um Service só inclui no DNS os Pods que já estão
  #   "Ready" — mas os Pods do Keycloak só ficam Ready DEPOIS de formar o
  #   cluster (que depende desta consulta DNS funcionar). Sem esta opção,
  #   teríamos um impasse: o 2º Pod nunca encontraria o 1º via DNS
  #   enquanto o 1º não estivesse Ready, e o 1º não fica Ready sem
  #   primeiro tentar formar o cluster. `publishNotReadyAddresses: true`
  #   quebra esse ciclo, publicando o IP do Pod no DNS assim que ele
  #   existe, independente do estado das probes.

  selector:
    app: keycloak
    # ↑ Mesmo rótulo usado pelo Deployment abaixo — este Service enxerga
    #   as 2 réplicas do Keycloak (e só elas).

  ports:
    - name: jgroups
      port: 7800
      # ↑ Porta usada pelo JGroups (TCP) para a comunicação REAL entre os
      #   Pods depois de se descobrirem via DNS — não precisa ser exposta
      #   para fora do cluster, só entre os próprios Pods do Keycloak.

---
# ------------------------------------------------------------------------------
# 2) Deployment — os Pods do Keycloak (2 réplicas)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: authentication
  labels:
    app: keycloak

spec:
  replicas: 2
  # ↑ Alta disponibilidade: 2 Pods idênticos atendendo login simultaneamente.
  #   O Traefik/Service faz balanceamento de carga entre eles automaticamente.

  selector:
    matchLabels:
      app: keycloak

  strategy:
    type: RollingUpdate
    # ↑ Ao atualizar a imagem/config, o Kubernetes troca os Pods GRADUALMENTE
    #   (um de cada vez), em vez de derrubar tudo e subir de novo — evita
    #   indisponibilidade do login da prefeitura durante deploys.
    rollingUpdate:
      maxUnavailable: 0
      # ↑ Nunca deixar MENOS de 2 Pods saudáveis no ar durante a atualização
      #   (zero Pods podem ficar indisponíveis ao mesmo tempo).
      maxSurge: 1
      # ↑ Permite subir 1 Pod EXTRA temporariamente (ficando 3 no total por
      #   um instante) para garantir a troca sem downtime.

  template:
    metadata:
      labels:
        app: keycloak
        # ↑ Este rótulo é usado por: (a) o Service ClusterIP normal (para
        #   o Ingress rotear tráfego), (b) o Service headless da seção 1
        #   (para o DNS_PING descobrir os Pods "irmãos" e formar o cluster
        #   de cache distribuído).

    spec:
      # "Anti-affinity": tenta espalhar as 2 réplicas em nós diferentes,
      # caso o cluster cresça no futuro. Em um cluster single-node (nosso
      # caso hoje) não tem efeito prático, mas já deixamos preparado.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["keycloak"]
                topologyKey: kubernetes.io/hostname
                # ↑ "Prefira" (não exige — é soft) agendar cada réplica em um
                #   nó (VM) físico diferente, para resiliência a falha de host.

      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          # ↑ Imagem OFICIAL do Keycloak, distribuída pelo próprio projeto
          #   (Quay.io, não Docker Hub), versão 26 — a série "Novo Keycloak"
          #   100% baseada em Quarkus (start-up rápido, baixo consumo de RAM
          #   comparado ao antigo Keycloak baseado em WildFly).

          args: ["start"]
          # ↑ "start" inicia o Keycloak em modo de produção (diferente de
          #   "start-dev", que é só para testes locais e NÃO deve ser usado
          #   aqui). NÃO usamos "--optimized": essa flag só é válida quando
          #   a imagem foi previamente processada com `kc.sh build` dentro
          #   de um Dockerfile customizado (gera uma imagem "otimizada",
          #   travando a configuração em tempo de build). A imagem OFICIAL
          #   "crua" (`quay.io/keycloak/keycloak:26.0`, usada aqui) NÃO vem
          #   pré-otimizada — usar "--optimized" nela falha com o erro
          #   "The '--optimized' flag was used for first ever server start"
          #   e o container entra em CrashLoopBackOff. Sem a flag, o
          #   Keycloak faz um "auto-build" rápido a cada start (poucos
          #   segundos a mais) e funciona corretamente com a imagem padrão.
          #   Se um dia vocês criarem uma imagem customizada (com temas ou
          #   plugins) via Dockerfile próprio rodando `kc.sh build` no
          #   build da imagem, aí sim "--optimized" pode ser reativado para
          #   acelerar o boot.

          ports:
            - name: http
              containerPort: 8080
              # ↑ Porta HTTP interna do Keycloak. TLS/HTTPS é terminado no
              #   Nginx da borda (fora deste cluster) — por isso rodamos só
              #   HTTP puro aqui dentro (ver Service LoadBalancer, seção 4
              #   deste arquivo, e nginx-edge/README.md).
            - name: management
              containerPort: 9000
              # ↑ Desde o Keycloak 25+, os endpoints de health/metrics vivem
              #   numa PORTA DE GERENCIAMENTO separada (9000), isolada da
              #   porta de aplicação (8080) — mais seguro, pois esses
              #   endpoints não ficam expostos publicamente pelo Ingress.

          env:
            # --- Conexão com o banco de dados PostgreSQL ------------------
            - name: KC_DB
              value: "postgres"
              # ↑ Diz ao Keycloak qual dialeto/driver de banco usar.

            - name: KC_DB_URL_HOST
              value: "postgres"
              # ↑ Hostname do banco = nome do Service criado em postgres-db.yaml
              #   (resolução via DNS interno do cluster).

            - name: KC_DB_URL_PORT
              value: "5432"
              # ↑ Porta padrão do PostgreSQL (mesma exposta pelo Service).

            - name: KC_DB_URL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: auth-stack-credentials
                  key: POSTGRES_DB
              # ↑ Em vez de repetir o valor "keycloak" aqui, lemos DIRETO do
              #   Secret — se o nome do banco mudar um dia, muda em um único lugar.

            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-stack-credentials
                  key: POSTGRES_USER

            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-stack-credentials
                  key: POSTGRES_PASSWORD
                  # ↑ `valueFrom.secretKeyRef` injeta o valor do Secret como
                  #   variável de ambiente SEM nunca expor a senha em texto
                  #   plano neste manifesto — só existe dentro do Secret.

            # --- Credenciais do administrador (usadas só no 1º boot) ------
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-stack-credentials
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
              # ↑ Nome atual desta variável a partir do Keycloak 26 (a antiga
              #   `KEYCLOAK_ADMIN` foi descontinuada). Confirmado pelo `.env`
              #   do Keycloak que já roda hoje fora do K3s nesta prefeitura.

            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-stack-credentials
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD

            # --- Hostname público (fixo, não depende de cabeçalho algum) ---
            - name: KC_HOSTNAME
              value: "https://sso.rondonopolis.mt.gov.br"
              # ↑ URL pública completa (com esquema `https://`) pela qual os
              #   usuários acessam o Keycloak. Passar a URL completa (em vez
              #   de só o domínio) faz o Keycloak usar SEMPRE "https://" ao
              #   gerar links/redirects/cookies, independente de qualquer
              #   cabeçalho de proxy — é o MESMO padrão já usado no `.env`
              #   do Keycloak que roda hoje fora do K3s nesta prefeitura.
              #   Ainda assim mantemos o KC_PROXY_HEADERS/KC_PROXY_TRUSTED_ADDRESSES
              #   abaixo como camada extra (defesa em profundidade, mesmo
              #   padrão do ambiente atual). Precisa bater EXATAMENTE com o
              #   domínio configurado no vhost do Nginx da borda.

            - name: KC_HOSTNAME_STRICT
              value: "false"
              # ↑ "false" permite que o Keycloak responda também por outros
              #   nomes (ex.: acesso via IP interno para debug), sem rejeitar
              #   a requisição. Em produção 100% fechada, pode ser "true".

            - name: KC_HTTP_ENABLED
              value: "true"
              # ↑ Habilita o listener HTTP puro (porta 8080) DENTRO do
              #   cluster. É seguro pois o tráfego HTTP não sai da rede
              #   interna do K3s: quem fala HTTPS com a internet é o Nginx
              #   da borda (fora deste cluster), que repassa a requisição
              #   já decodificada DIRETO para este Pod, na porta 18443
              #   exposta pelo Service LoadBalancer (seção 4 abaixo) — sem
              #   Ingress/Traefik no meio do caminho (ver nginx-edge/).

            - name: KC_PROXY_HEADERS
              value: "xforwarded"
              # ↑ NOTA TÉCNICA: nas versões atuais do Keycloak/Quarkus, o
              #   valor aceito é exatamente "xforwarded" (sem hífen) — ele
              #   instrui o Keycloak a CONFIAR nos cabeçalhos
              #   X-Forwarded-For / X-Forwarded-Proto / X-Forwarded-Host
              #   que chegam até ele. Usado principalmente para IP de
              #   origem correto nos logs de auditoria, já que o esquema
              #   (https) já vem fixo via KC_HOSTNAME acima.

            - name: KC_PROXY_TRUSTED_ADDRESSES
              value: "192.168.0.218/32,10.42.0.0/16"
              # ↑ Mesmo espírito do `PROXY_TRUSTED_ADDRESSES=192.168.0.218`
              #   já usado no `.env` do Keycloak que roda hoje fora do K3s
              #   — o Nginx da borda fala DIRETO com este Pod agora (sem
              #   Traefik no meio, graças ao Service LoadBalancer da seção
              #   4), então o IP real do Nginx volta a ser o principal.
              #   Incluímos TAMBÉM o CIDR de Pods do cluster
              #   (10.42.0.0/16) como rede extra confiável, cobrindo o caso
              #   de o Kubernetes fazer NAT na conexão antes dela chegar
              #   ao Pod (comportamento que pode variar). Depois do
              #   primeiro deploy, vale conferir nos logs do Keycloak qual
              #   IP de origem ele está realmente enxergando e, se
              #   quiser, restringir esta lista para só o que for
              #   observado de fato.

            - name: KC_LOG_LEVEL
              value: "INFO"
              # ↑ Nível de log padrão (mesmo valor já usado no `.env` atual
              #   fora do K3s). Aumente para "DEBUG" temporariamente ao
              #   investigar um problema específico — gera bem mais volume
              #   de log, não deixe ligado permanentemente em produção.

            # --- Health checks e observabilidade ---------------------------
            - name: KC_HEALTH_ENABLED
              value: "true"
              # ↑ Liga os endpoints /health/live, /health/ready e /health/started
              #   na porta de management (9000), usados pelas probes abaixo.

            - name: KC_METRICS_ENABLED
              value: "true"
              # ↑ Liga o endpoint /metrics (formato Prometheus) na porta de
              #   management — útil para monitoramento futuro (Grafana/Prometheus),
              #   sem custo relevante de performance.

            # --- Clustering (cache distribuído entre as 2 réplicas) --------
            - name: KC_CACHE
              value: "ispn"
              # ↑ ⚠️ Os únicos valores aceitos pelo Keycloak 26 são "ispn"
              #   (cache distribuído via Infinispan — o que queremos) ou
              #   "local" (cada Pod isolado, sem HA). "ha" NÃO é um valor
              #   válido (causava o erro "Invalid value for option
              #   'KC_CACHE': ha. Expected values are: ispn, local" e
              #   CrashLoopBackOff). Com "ispn", as sessões de login são
              #   replicadas entre os Pods — sem isso, cada réplica teria
              #   sua própria "memória" isolada e o usuário seria deslogado
              #   ao alternar de Pod.

            - name: KC_CACHE_STACK
              value: "kubernetes"
              # ↑ Seleciona o stack JGroups pronto chamado "kubernetes",
              #   embutido na imagem do Keycloak — mas ele sozinho NÃO
              #   acha os outros Pods; precisa que a variável
              #   JAVA_OPTS_APPEND (logo abaixo) informe ONDE procurar via
              #   DNS. Não precisamos declarar KC_CACHE_CONFIG_FILE: o
              #   Keycloak já usa o arquivo padrão de cache distribuído
              #   (cache-ispn.xml, embutido na imagem) automaticamente
              #   quando KC_CACHE=ispn.

            - name: JAVA_OPTS_APPEND
              value: "-Djgroups.dns.query=keycloak-headless.authentication.svc.cluster.local"
              # ↑ ⚠️ PEÇA ESSENCIAL para o clustering funcionar — sem ela, o
              #   Keycloak crasha na subida com "dns_query can not be null
              #   or empty". Diferente das variáveis KC_*, esta é lida pelo
              #   SCRIPT DE ENTRADA do container (não pelo parser de config
              #   do Keycloak) e repassada como propriedade de sistema Java
              #   (`-D`) para a JVM. O valor é o nome DNS completo do
              #   Service HEADLESS criado na seção 1 deste arquivo
              #   (`keycloak-headless.<namespace>.svc.cluster.local`) — é
              #   consultando esse nome que o protocolo DNS_PING descobre
              #   os IPs de todos os Pods do Keycloak e forma o cluster.
              #   Se algum dia o namespace mudar de nome, esta linha
              #   também precisa mudar.

          resources:
            # ↑ Ajustado para caber confortavelmente em uma VM de 8GB
            #   rodando 2 réplicas do Keycloak + Postgres + Vaultwarden.
            requests:
              cpu: "300m"
              memory: "600Mi"
              # ↑ RAM garantida por Pod. O Keycloak Quarkus roda bem com
              #   ~512-700Mi em cargas de uma prefeitura de porte médio.
            limits:
              cpu: "1000m"
              memory: "1024Mi"
              # ↑ Teto de 1 vCPU e 1GiB de RAM por Pod — com 2 réplicas, o
              #   consumo máximo teórico do Keycloak é 2GiB, deixando o
              #   restante da VM livre para SO, Postgres e Vaultwarden.

          # --- Probes de saúde (usam a porta de management: 9000) ----------
          startupProbe:
            # ↑ Protege contra o Keycloak ser morto por "demorar para subir"
            #   na primeira inicialização (que é mais lenta, pois cria o
            #   schema do banco). Enquanto esta probe não passar, as demais
            #   (liveness/readiness) ficam PAUSADAS.
            httpGet:
              path: /health/started
              port: 9000
            failureThreshold: 30
            # ↑ Permite até 30 tentativas falhas...
            periodSeconds: 10
            # ↑ ...verificando a cada 10s = até 5 minutos de tolerância para
            #   o boot inicial completar antes de considerar falha real.

          livenessProbe:
            # ↑ "O processo travou/deadlock?" — se falhar repetidamente, o
            #   Kubernetes MATA e RECRIA o container.
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 0
            # ↑ Já pode começar a checar assim que o startupProbe passar
            #   (elas não rodam em paralelo — a liveness só começa depois).
            periodSeconds: 15
            failureThreshold: 3
            # ↑ 3 falhas seguidas (45s) antes de reiniciar o Pod.

          readinessProbe:
            # ↑ "Este Pod está pronto para RECEBER TRÁFEGO agora?" — se
            #   falhar, o Service para de enviar requisições para este Pod
            #   especificamente (sem matar o container), até ele se recuperar.
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            # ↑ Injeta os arquivos do tema customizado "prefeitura" (ver
            #   keycloak-theme.yaml) dentro da imagem oficial do Keycloak,
            #   sem precisar buildar uma imagem Docker própria. Cada
            #   arquivo do ConfigMap é montado INDIVIDUALMENTE (via
            #   `subPath`) no caminho exato que o Keycloak espera dentro
            #   da estrutura de um tema — ver
            #   `/opt/keycloak/themes/<nome>/login/...` no cabeçalho de
            #   keycloak-theme.yaml para o porquê dessa estrutura.
            - name: theme-prefeitura
              mountPath: /opt/keycloak/themes/prefeitura/login/theme.properties
              subPath: theme.properties
            - name: theme-prefeitura
              mountPath: /opt/keycloak/themes/prefeitura/login/resources/css/custom.css
              subPath: custom.css
            # ↑ Quando o logo.png for adicionado ao ConfigMap (ver
            #   instruções no final de keycloak-theme.yaml), adicione aqui
            #   mais um item seguindo o mesmo padrão:
            #   - name: theme-prefeitura
            #     mountPath: /opt/keycloak/themes/prefeitura/login/resources/img/logo.png
            #     subPath: logo.png

      volumes:
        - name: theme-prefeitura
          configMap:
            name: keycloak-theme-prefeitura
        # ↑ ⚠️ Alterar o CONTEÚDO do ConfigMap (ex.: adicionar a cor real)
        #   não exige mudar esta lista de volumes — o Kubernetes atualiza
        #   o arquivo montado sozinho em segundos. MAS o Keycloak, rodando
        #   em modo produção (`start`, não `start-dev`), MANTÉM O TEMA EM
        #   CACHE em memória — então depois de editar keycloak-theme.yaml
        #   e dar `git push`, rode também:
        #     kubectl rollout restart deployment/keycloak -n authentication
        #   para os Pods relerem o tema atualizado do disco.

      # (Sem tolerations/nodeSelector — cluster single-node não precisa.)

---
# ------------------------------------------------------------------------------
# 3) Service — endereço de rede interno para o Keycloak (uso dentro do cluster)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: authentication
  labels:
    app: keycloak

spec:
  type: ClusterIP
  # ↑ Só acessível de dentro do cluster — útil para diagnóstico
  #   (`kubectl exec ... curl http://keycloak:8080/`) e para qualquer outro
  #   Pod do cluster que precise falar com o Keycloak internamente. A
  #   exposição para a internet é feita pelo Service LoadBalancer abaixo,
  #   não por este.

  selector:
    app: keycloak
    # ↑ Balanceia tráfego automaticamente entre as 2 réplicas do Deployment.

  ports:
    - name: http
      port: 8080
      # ↑ Porta exposta pelo Service para o resto do cluster.
      targetPort: http
      # ↑ Redireciona para a porta nomeada "http" (8080) dentro do container.
      protocol: TCP

---
# ------------------------------------------------------------------------------
# 4) Service (LoadBalancer) — expõe o Keycloak na PORTA 18443, a MESMA porta
#    que o Keycloak antigo (bare-metal) já usava nesta VM
# ------------------------------------------------------------------------------
# ⚠️ POR QUE ISSO EXISTE (em vez de um Ingress na porta 80)
#   O Nginx da borda (aaPanel, 192.168.0.218) já tem um vhost configurado e
#   FUNCIONANDO apontando para "192.168.0.225:18443" — a mesma VM, a MESMA
#   porta que o Keycloak antigo usava. Para não precisar mexer em NADA na
#   configuração do Nginx (zero risco de errar algo lá, zero downtime
#   dependente de outra equipe), fazemos o K3s "ocupar" essa mesma porta na
#   VM, mantendo o Nginx 100% como já está. Ver `nginx-edge/README.md` para
#   a explicação completa de por que esta abordagem foi escolhida em vez de
#   Ingress+Traefik (que exigiria editar o Nginx para apontar pra porta 80).
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: keycloak-external
  namespace: authentication
  labels:
    app: keycloak

spec:
  type: LoadBalancer
  # ↑ No K3s "de fábrica", `type: LoadBalancer` é atendido automaticamente
  #   pelo ServiceLB embutido (também chamado "klipper-lb") — sem precisar
  #   instalar MetalLB nem nada externo. Ele faz um Pod escutar a porta
  #   pedida (18443) DIRETO NA VM (0.0.0.0:18443) e encaminhar para este
  #   Service — é o que faz o Nginx conseguir falar com
  #   "192.168.0.225:18443" e chegar até aqui, exatamente como antes.

  externalTrafficPolicy: Local
  # ↑ IMPORTANTE: sem isso, o Kubernetes reescreveria o IP de origem das
  #   conexões (SNAT/masquerade) antes de entregar ao Pod do Keycloak — o
  #   Keycloak enxergaria toda conexão como vinda de dentro do cluster, e
  #   nunca do IP real do Nginx (192.168.0.218), quebrando a lógica de
  #   KC_PROXY_TRUSTED_ADDRESSES (ver keycloak.yaml). Com "Local", o IP de
  #   origem é preservado. Seguro aqui porque o cluster é single-node (só
  #   existe "pmrkeycloak") — em um cluster multi-node, "Local" exigiria
  #   que o Nginx soubesse especificamente qual nó tem o Pod, o que não é
  #   o caso aqui.

  selector:
    app: keycloak

  ports:
    - name: legacy-18443
      port: 18443
      # ↑ A porta que o Nginx já usa — não mude isso sem também mudar a
      #   config do Nginx (o que estamos justamente tentando evitar).
      targetPort: http
      # ↑ Redireciona para a porta nomeada "http" (8080) dentro do
      #   container — mesmo targetPort do Service interno acima.
      protocol: TCP
