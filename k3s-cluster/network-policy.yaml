# ==============================================================================
# ARQUIVO: k3s-cluster/network-policy.yaml
# ------------------------------------------------------------------------------
# OBJETIVO
#   Aplicar segmentação de rede DENTRO do cluster (defesa em profundidade):
#   o banco de dados PostgreSQL só pode ser acessado pelos Pods do
#   Keycloak — nenhum outro Pod do namespace (nem o Vaultwarden, nem
#   qualquer workload futuro) consegue abrir conexão na porta 5432.
#
#   Isso limita o "raio de explosão" (blast radius) caso um outro
#   componente da stack seja comprometido: mesmo que um invasor consiga
#   executar comandos dentro do Pod do Vaultwarden, por exemplo, a rede do
#   cluster já impede que ele alcance o banco de dados de credenciais do
#   Keycloak diretamente.
#
# ✅ CONFIRMADO AO VIVO: ESTA POLÍTICA É REALMENTE APLICADA NESTE CLUSTER
#   Versões antigas deste documento afirmavam que o K3s, usando Flannel como
#   CNI padrão, NÃO aplicaria NetworkPolicies — isso era uma suposição
#   baseada em documentação genérica, e testamos ao vivo no cluster real
#   para confirmar. O teste refutou a suposição: o K3s atual (a partir da
#   versão instalada por scripts/bootstrap-vm.sh) já vem com um controlador
#   de NetworkPolicy embutido, e a política É enforçada de verdade.
#
#   Prova (reproduzível com `kubectl run` + `pg_isready`):
#     - Pod SEM o rótulo `app: keycloak` tentando falar com o Postgres na
#       porta 5432 -> BLOQUEADO ("no response" / connection refused).
#     - Pod COM o rótulo `app: keycloak` -> permitido normalmente.
#   Foi justamente essa aplicação real (e um Pod do CronJob de backup sem
#   o rótulo certo) que causava backups vazios em produção — ver o
#   histórico de correção no topo de postgres-backup-cronjob.yaml.
#
#   CONSEQUÊNCIA PRÁTICA PARA QUEM FOR ADICIONAR UM NOVO WORKLOAD:
#   Qualquer novo Pod/Job/CronJob que precisar falar com o Postgres neste
#   namespace só vai conseguir se (a) tiver um rótulo explicitamente
#   permitido em algum `from:` abaixo, e (b) esse rótulo for adicionado ao
#   `spec.template.metadata.labels` do recurso correspondente — um
#   `podSelector` de NetworkPolicy NÃO enxerga rótulos herdados de
#   Deployment/CronJob automaticamente, o Pod em si precisa carregá-los.
#
#   Não custa nada, ainda assim, tratar isto como camada ADICIONAL de
#   defesa em profundidade — as senhas fortes do Secret e o isolamento do
#   namespace continuam sendo a primeira linha de defesa, caso este cluster
#   um dia troque de CNI para um que não aplique NetworkPolicy.
# ==============================================================================

apiVersion: networking.k8s.io/v1
# ↑ NetworkPolicy é um recurso "core" estável da API de rede do Kubernetes
#   (a interpretação/enforcement dela é que depende do CNI, não a
#   existência do recurso em si — por isso `kubectl apply` sempre funciona).

kind: NetworkPolicy

metadata:
  name: postgres-allow-only-keycloak
  namespace: authentication

spec:
  podSelector:
    matchLabels:
      app: postgres
      # ↑ Esta política se aplica aos Pods com o rótulo `app: postgres`
      #   (ou seja: os Pods criados pelo Deployment em postgres-db.yaml).
      #   É neles que as regras abaixo passam a valer.

  policyTypes:
    - Ingress
    # ↑ Só estamos controlando tráfego de ENTRADA (quem pode se conectar
    #   AO Postgres). Não restringimos tráfego de saída (Egress) do
    #   Postgres neste arquivo — ele já não inicia conexões para fora.

  ingress:
    # ↑ Lista de regras de permissão. IMPORTANTE: assim que um Pod passa a
    #   ter QUALQUER NetworkPolicy de Ingress aplicada a ele, o
    #   comportamento padrão vira "negar tudo que não estiver
    #   explicitamente permitido aqui" — ou seja, esta única regra abaixo
    #   já é suficiente para bloquear todo o resto automaticamente (quando
    #   houver um CNI com enforcement).

    - from:
        - podSelector:
            matchLabels:
              app: keycloak
              # ↑ Só permite conexões vindas de Pods com o rótulo
              #   `app: keycloak` (as 2 réplicas criadas em keycloak.yaml)
              #   — e apenas DENTRO do mesmo namespace "authentication"
              #   (um `podSelector` sozinho, sem `namespaceSelector`, já
              #   restringe implicitamente ao namespace desta própria
              #   NetworkPolicy).

        - podSelector:
            matchLabels:
              app: postgres-backup
              # ↑ Também permite o Pod do CronJob de backup diário
              #   (k3s-cluster/postgres-backup-cronjob.yaml), que roda
              #   `pg_dump` contra este mesmo Postgres. Duas entradas
              #   separadas dentro de `from:` funcionam como "OU" — cada uma
              #   é avaliada independentemente (não é a mesma coisa que
              #   colocar as duas condições dentro de um único
              #   `matchLabels`, que exigiria os DOIS rótulos ao mesmo
              #   tempo no mesmo Pod).

      ports:
        - protocol: TCP
          port: 5432
          # ↑ Restringe ainda mais: mesmo os Pods autorizados acima só
          #   podem falar com o Postgres NESTA porta específica (a porta
          #   real do PostgreSQL), fechando qualquer outra porta que o
          #   container eventualmente exponha.

# ==============================================================================
# COMO TESTAR SE A POLÍTICA ESTÁ SENDO REALMENTE APLICADA (após instalar um
# CNI com enforcement de NetworkPolicy):
#   # Isto DEVE falhar (timeout/connection refused) — Vaultwarden não pode
#   # falar com o Postgres:
#   kubectl exec -n authentication deploy/vaultwarden -- \
#     wget -qO- --timeout=5 postgres:5432 || echo "Bloqueado como esperado"
#
#   # Isto DEVE funcionar — Keycloak pode falar com o Postgres:
#   kubectl exec -n authentication deploy/keycloak -- \
#     nc -zv postgres 5432
# ==============================================================================
