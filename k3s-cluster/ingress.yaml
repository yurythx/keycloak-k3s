# ==============================================================================
# ARQUIVO: k3s-cluster/ingress.yaml
# ------------------------------------------------------------------------------
# OBJETIVO
#   Expor o Keycloak e o Vaultwarden para a internet através de DOIS
#   domínios distintos, usando o Traefik — o Ingress Controller que já vem
#   INSTALADO POR PADRÃO em qualquer cluster K3s (não precisa instalar Nginx
#   Ingress nem nada extra).
#
#   login.prefeitura.gov.br   -> Service "keycloak"   (porta 8080)
#   cofres.prefeitura.gov.br  -> Service "vaultwarden" (porta 80)
#
# COMO FUNCIONA O ROTEAMENTO
#   O Traefik recebe TODO o tráfego HTTP/HTTPS que chega na VM (ele já
#   ocupa as portas 80 e 443 do host por padrão no K3s) e, com base no
#   cabeçalho "Host" da requisição, decide para qual Service interno
#   encaminhar — é assim que conseguimos hospedar 2 aplicações diferentes
#   usando o mesmo IP público e as mesmas portas 80/443.
#
# ⚠️ SOBRE TLS/HTTPS
#   Este manifesto define a ESTRUTURA de roteamento. Para HTTPS válido
#   (certificado confiável, sem alerta no navegador), o próximo passo
#   recomendado é instalar o cert-manager + emissor Let's Encrypt no
#   cluster — deixamos o bloco `tls:` já comentado e pronto para ativar.
#   Enquanto isso não for feito, o Traefik ainda responde em HTTPS com um
#   certificado autoassinado padrão (gera alerta de segurança no navegador,
#   mas o tráfego já é criptografado).
# ==============================================================================

apiVersion: networking.k8s.io/v1
# ↑ Versão estável (GA) da API de Ingress do Kubernetes.

kind: Ingress
# ↑ Um Ingress é a "porta de entrada" HTTP/HTTPS do cluster — traduz nomes
#   de domínio + caminhos em tráfego roteado para Services internos.

metadata:
  name: auth-stack-ingress
  namespace: authentication

  annotations:
    # ↑ Annotations são metadados EXTRAS lidos pelo Ingress Controller
    #   (Traefik) para comportamentos específicos que a spec genérica do
    #   Kubernetes não cobre.

    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web
    # ↑ Diz ao Traefik para escutar este Ingress tanto na entrypoint
    #   "web" (porta 80/HTTP) quanto "websecure" (porta 443/HTTPS) — os
    #   dois entrypoints já vêm criados por padrão na instalação do K3s.

    traefik.ingress.kubernetes.io/router.tls: "true"
    # ↑ Ativa TLS (HTTPS) para este roteador — sem certificado próprio
    #   configurado, o Traefik usa o certificado autoassinado padrão dele.

  # ↑ (Opcional, comentado) Se você instalar o cert-manager mais adiante,
  #   descomente a linha abaixo apontando para o ClusterIssuer do
  #   Let's Encrypt — ele passa a emitir/renovar certificados válidos
  #   automaticamente para os hosts declarados neste Ingress:
  #
  #   cert-manager.io/cluster-issuer: "letsencrypt-prod"

spec:
  ingressClassName: traefik
  # ↑ Diz explicitamente ao Kubernetes "use o Ingress Controller chamado
  #   'traefik' para processar este recurso" — é o nome padrão da
  #   IngressClass já registrada de fábrica pelo K3s.

  # ----------------------------------------------------------------------
  # tls:
  # ↑ (Bloco comentado — ative após instalar o cert-manager) Quando ativo,
  #   instrui o Traefik/cert-manager a guardar o certificado emitido dentro
  #   de um Secret do tipo `kubernetes.io/tls` com o nome indicado, e a
  #   usá-lo para servir HTTPS nestes hosts específicos.
  #
  # tls:
  #   - hosts:
  #       - login.prefeitura.gov.br
  #       - cofres.prefeitura.gov.br
  #     secretName: auth-stack-tls-cert
  # ----------------------------------------------------------------------

  rules:
    # ↑ Lista de regras de roteamento — cada item associa um domínio
    #   (host) a um Service de destino.

    - host: login.prefeitura.gov.br
      # ↑ Domínio público do Keycloak. Precisa ter um registro DNS tipo A
      #   apontando para o IP público da VM (configurado FORA deste
      #   repositório, no provedor de DNS da prefeitura).

      http:
        paths:
          - path: /
            # ↑ Aplica a regra para QUALQUER caminho a partir da raiz
            #   (ex.: /admin, /realms/prefeitura, /resources, etc.).
            pathType: Prefix
            # ↑ "Prefix" = casa este `path` e tudo que vier depois dele.
            #   (A alternativa "Exact" exigiria bater o caminho 100% igual.)
            backend:
              service:
                name: keycloak
                # ↑ Nome do Service definido em keycloak.yaml.
                port:
                  number: 8080
                  # ↑ Porta EXPOSTA PELO SERVICE (não a porta do container
                  #   diretamente) — precisa bater com `spec.ports[].port`
                  #   do Service "keycloak".

    - host: cofres.prefeitura.gov.br
      # ↑ Domínio público do Vaultwarden — também precisa de registro DNS
      #   tipo A próprio, apontando para o mesmo IP público da VM.

      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                # ↑ Nome do Service definido em vaultwarden.yaml.
                port:
                  number: 80
                  # ↑ Porta exposta pelo Service "vaultwarden".

# ==============================================================================
# PRÓXIMOS PASSOS RECOMENDADOS (fora do escopo deste arquivo, mas importantes):
#   1. Configurar 2 registros DNS tipo A na zona "prefeitura.gov.br":
#        login.prefeitura.gov.br   -> IP público da VM
#        cofres.prefeitura.gov.br  -> IP público da VM
#   2. Abrir/mapear apenas as portas 80 e 443 no firewall/roteador da VM
#      (NUNCA a porta do SSH/Kubernetes API para a internet).
#   3. Instalar o cert-manager para certificados HTTPS válidos automáticos:
#        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#      e então criar um ClusterIssuer do Let's Encrypt, descomentando o
#      bloco `tls:` acima.
# ==============================================================================
