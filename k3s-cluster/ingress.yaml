# ==============================================================================
# ARQUIVO: k3s-cluster/ingress.yaml
# ------------------------------------------------------------------------------
# OBJETIVO
#   Rotear as requisições HTTP que chegam ao Traefik (dentro do K3s) para o
#   Keycloak ou o Vaultwarden, de acordo com o domínio (Host header):
#
#   sso.rondonopolis.mt.gov.br   -> Service "keycloak"   (porta 8080)
#   cofre.rondonopolis.mt.gov.br -> Service "vaultwarden" (porta 80)
#
# ⚠️ ARQUITETURA DE REDE DESTA INSTALAÇÃO — LEIA ANTES DE MEXER
#   Diferente de uma instalação "padrão" (onde o próprio Traefik do K3s
#   ficaria exposto direto na internet e teria que emitir seu próprio
#   certificado HTTPS), AQUI já existe um servidor **Nginx isolado na rede
#   da prefeitura** que fica na borda, recebe TODO o tráfego HTTPS público,
#   TERMINA o TLS (guarda o certificado real) e repassa a requisição já
#   decodificada, em HTTP puro, para este cluster K3s.
#
#   Por isso:
#     - Este Ingress NÃO declara bloco `tls:` nem annotation de
#       cert-manager — o certificado "de verdade" não vive aqui, vive no
#       Nginx da borda. O Traefik deste cluster só precisa falar HTTP.
#     - O Traefik só escuta na entrypoint "web" (porta 80). A entrypoint
#       "websecure" (443) do K3s simplesmente não é usada nesta topologia.
#     - Para o Keycloak/Vaultwarden ainda assim SABEREM que a requisição
#       original do usuário veio por HTTPS (importante para gerar URLs e
#       cookies corretos), o Nginx da borda precisa enviar o cabeçalho
#       `X-Forwarded-Proto: https`, e o Traefik precisa CONFIAR nesse
#       cabeçalho em vez de sobrescrevê-lo — isso é configurado em
#       `k3s-cluster/traefik-trusted-headers.yaml` (leia os comentários lá,
#       é uma peça CRÍTICA desta cadeia, não pule esse arquivo).
#     - A configuração do lado do Nginx (os blocos `server { ... }` que
#       apontam para este cluster) fica documentada em `nginx-edge/`, na
#       raiz deste repositório — não é aplicada via kubectl (o Nginx não
#       roda dentro do K3s), é só a referência para você colar na
#       configuração existente do seu servidor Nginx.
# ==============================================================================

apiVersion: networking.k8s.io/v1
# ↑ Versão estável (GA) da API de Ingress do Kubernetes.

kind: Ingress
# ↑ Um Ingress é a "porta de entrada" HTTP do cluster — traduz nomes de
#   domínio + caminhos em tráfego roteado para Services internos.

metadata:
  name: auth-stack-ingress
  namespace: authentication

  annotations:
    # ↑ Annotations são metadados EXTRAS lidos pelo Ingress Controller
    #   (Traefik) para comportamentos específicos que a spec genérica do
    #   Kubernetes não cobre.

    traefik.ingress.kubernetes.io/router.entrypoints: web
    # ↑ Diz ao Traefik para escutar este Ingress SÓ na entrypoint "web"
    #   (porta 80/HTTP) — é só o que chega vindo do Nginx da borda. Não
    #   incluímos "websecure" (443) porque, nesta topologia, ninguém fala
    #   HTTPS diretamente com o Traefik deste cluster.

spec:
  ingressClassName: traefik
  # ↑ Diz explicitamente ao Kubernetes "use o Ingress Controller chamado
  #   'traefik' para processar este recurso" — é o nome padrão da
  #   IngressClass já registrada de fábrica pelo K3s.

  rules:
    # ↑ Lista de regras de roteamento — cada item associa um domínio
    #   (host) a um Service de destino. O Traefik decide qual regra usar
    #   com base no cabeçalho "Host" que o Nginx da borda REPASSA
    #   integralmente na requisição (por isso o Nginx precisa enviar
    #   `proxy_set_header Host $host;` — ver nginx-edge/).

    - host: sso.rondonopolis.mt.gov.br
      # ↑ Domínio público do Keycloak (SSO da prefeitura de Rondonópolis).
      #   O registro DNS tipo A deste domínio deve apontar para o IP
      #   PÚBLICO DO NGINX DA BORDA — não para o IP desta VM do K3s, que
      #   nesta topologia não precisa ter nenhum IP público.

      http:
        paths:
          - path: /
            # ↑ Aplica a regra para QUALQUER caminho a partir da raiz
            #   (ex.: /admin, /realms/prefeitura, /resources, etc.).
            pathType: Prefix
            # ↑ "Prefix" = casa este `path` e tudo que vier depois dele.
            #   (A alternativa "Exact" exigiria bater o caminho 100% igual.)
            backend:
              service:
                name: keycloak
                # ↑ Nome do Service definido em keycloak.yaml.
                port:
                  number: 8080
                  # ↑ Porta EXPOSTA PELO SERVICE (não a porta do container
                  #   diretamente) — precisa bater com `spec.ports[].port`
                  #   do Service "keycloak".

    - host: cofre.rondonopolis.mt.gov.br
      # ↑ Domínio público do Vaultwarden — mesmo raciocínio: o DNS aponta
      #   para o IP público do Nginx da borda, não para o desta VM.

      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                # ↑ Nome do Service definido em vaultwarden.yaml.
                port:
                  number: 80
                  # ↑ Porta exposta pelo Service "vaultwarden".

# ==============================================================================
# PRÓXIMOS PASSOS RECOMENDADOS (fora do escopo deste arquivo — ver README.md):
#   1. Aplicar k3s-cluster/traefik-trusted-headers.yaml com o IP real do seu
#      Nginx da borda (ESSENCIAL — sem isso, o Keycloak vai gerar links
#      "http://" em vez de "https://" e o login pode quebrar em loop de
#      redirecionamento).
#   2. Copiar a configuração de exemplo em nginx-edge/ para dentro da
#      configuração já existente do seu Nginx, ajustando o IP interno desta
#      VM e os caminhos dos certificados TLS que o Nginx já gerencia.
#   3. Confirmar que o Nginx da borda consegue alcançar esta VM na porta 80
#      (mesma rede interna/VLAN, ou rota configurada entre os segmentos).
# ==============================================================================
