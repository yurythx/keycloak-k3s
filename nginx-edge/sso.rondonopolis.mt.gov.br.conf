# ==============================================================================
# ARQUIVO DE REFERÊNCIA (não aplicado via kubectl): nginx-edge/sso.rondonopolis.mt.gov.br.conf
# ------------------------------------------------------------------------------
# Cópia EXATA do vhost real que já está no servidor Nginx (aaPanel/BT
# Panel, IP 192.168.0.218) para o domínio sso.rondonopolis.mt.gov.br —
# SEM NENHUMA ALTERAÇÃO.
#
# ✅ NADA PRECISA MUDAR NESTE ARQUIVO
#   A arquitetura escolhida foi fazer o K3s expor o Keycloak na MESMA porta
#   que o Keycloak antigo (bare-metal) já usava nesta VM — 18443 — em vez
#   de mudar o Nginx para apontar para uma porta diferente (ex.: 80 via
#   Ingress/Traefik). Isso significa que este `proxy_pass
#   http://192.168.0.225:18443;` continua válido tal como está: quem
#   responde nessa porta agora é o K3s (via um Service tipo LoadBalancer
#   em `k3s-cluster/keycloak.yaml`), não mais o Docker antigo — mas do
#   ponto de vista do Nginx, nada mudou.
#
#   Ver `k3s-cluster/keycloak.yaml` (seção "Service LoadBalancer") e
#   `nginx-edge/README.md` para o detalhamento completo de por que esta
#   abordagem foi escolhida.
# ==============================================================================

server {
    listen 80;

    listen 443 ssl http2 ;
    listen [::]:80;

    listen [::]:443 ssl http2 ;

    server_name sso.rondonopolis.mt.gov.br;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/sso.rondonopolis.mt.gov.br;
    include /www/server/panel/vhost/nginx/extension/sso.rondonopolis.mt.gov.br/*.conf;

    #CERT-APPLY-CHECK--START
    # Configuration related to file verification for SSL certificate application - Do not delete
    include /www/server/panel/vhost/nginx/well-known/sso.rondonopolis.mt.gov.br.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/sso.rondonopolis.mt.gov.br/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/sso.rondonopolis.mt.gov.br/privkey.pem;
    # 🔒 PENDENTE DE APLICAR NO SERVIDOR REAL (auditoria ago/2026): este
    #   arquivo é uma CÓPIA de referência (ver cabeçalho) — mudar aqui NÃO
    #   muda o Nginx de produção. TLSv1.1 removido (protocolo obsoleto,
    #   depreciado por PCI-DSS desde 2018) — aplique a mesma mudança no
    #   aaPanel (IP do Nginx de borda) e recarregue o serviço:
    #     nginx -t && systemctl reload nginx
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # 🔒 PENDENTE DE APLICAR NO SERVIDOR REAL: HSTS reforçado com
    #   includeSubDomains (mesma ressalva acima — sincronizar manualmente
    #   com o aaPanel). Sem "preload" de propósito: exige compromisso de
    #   HTTPS em TODOS os subdomínios de rondonopolis.mt.gov.br, decisão
    #   que não cabe só a este serviço.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    error_page 497  https://$host$request_uri;
    #SSL-END
    #REDIRECT START

    #REDIRECT END

    #ERROR-PAGE-START  Error page configuration, allowed to be commented, deleted or modified
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP reference configuration, can be annotated or modified

    include enable-php-00.conf;
    #PHP-INFO-END

    #IP-RESTRICT-START Restrict access to IP configuration, IP blacklist and whitelist


    #IP-RESTRICT-END

    #BASICAUTH START

    #BASICAUTH END

    #SUB_FILTER START

    #SUB_FILTER END

    #GZIP START

    #GZIP END

    #GLOBAL-CACHE START

    location ~ .*\.(css|js|jpe?g|gif|png|webp|woff|eot|ttf|svg|ico|css\.map|js\.map)$
    {
        expires 1d;
        error_log /dev/null;
        access_log /dev/null;
    }
    #GLOBAL-CACHE END

    #WEBSOCKET-SUPPORT START
    proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    #WEBSOCKET-SUPPORT END

    #PROXY-CONF-START
    location ^~ / {

    proxy_pass http://192.168.0.225:18443;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Real-Port $remote_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    }

    #PROXY-CONF-END

    #SERVER-BLOCK START

    #SERVER-BLOCK END

    #Prohibited access to files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #One click application for SSL certificate verification directory related settings
    location /.well-known{
        allow all;
        root /www/wwwroot/sso.rondonopolis.mt.gov.br;
    }

    #Prohibit placing sensitive files in the certificate verification directory
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    #LOG START
    access_log  /www/wwwlogs/sso.rondonopolis.mt.gov.br.log;
    error_log  /www/wwwlogs/sso.rondonopolis.mt.gov.br.error.log;

    #LOG END
}
