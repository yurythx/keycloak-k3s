# ==============================================================================
# ARQUIVO DE REFERÊNCIA (não aplicado via kubectl): nginx-edge/sso.rondonopolis.mt.gov.br.conf
# ------------------------------------------------------------------------------
# Esta é a config REAL que já roda no servidor Nginx (aaPanel/BT Panel,
# IP 192.168.0.218), copiada tal como está hoje — só com as linhas
# marcadas com "# ALTERADO:" / "# NOVO:" mudadas. Todo o resto (blocos de
# SSL, cache, log, marcadores do painel como #PROXY-CONF-START) foi mantido
# 100% igual ao original de propósito, para não interferir na forma como o
# aaPanel gerencia certificado/renovação deste site.
#
# ⚠️ ATENÇÃO AO EDITAR PELO PAINEL: se depois de colar isto você usar a
# ferramenta gráfica "Proxy Reverso" do aaPanel nas configurações deste
# site, ELA VAI SOBRESCREVER o bloco entre #PROXY-CONF-START e
# #PROXY-CONF-END com a config gerada pela própria interface — os
# cabeçalhos X-Forwarded-Proto/X-Forwarded-Host adicionados abaixo
# seriam perdidos nesse caso. Se precisar reconfigurar pela interface
# gráfica no futuro, reaplique essas duas linhas depois.
#
# O QUE MUDOU EM RELAÇÃO AO QUE JÁ ESTAVA NO SERVIDOR:
#   1. proxy_pass: porta 18443 (Keycloak antigo, bare-metal) -> porta 80
#      (Traefik do K3s, que decide internamente para onde mandar com base
#      no Host). O IP continua o mesmo (192.168.0.225) porque o K3s está
#      sendo instalado NA MESMA VM que já hospedava o Keycloak antigo.
#   2. Adicionadas 2 linhas nomeadas com "# NOVO:" (X-Forwarded-Proto e
#      X-Forwarded-Host) — o Keycloak novo já funciona sem elas (o
#      KC_HOSTNAME fixo já resolve o essencial, do mesmo jeito que o
#      Keycloak atual funciona sem X-Forwarded-Proto hoje), mas adicioná-
#      las fecha uma lacuna de segurança (o realm pode exigir "Require
#      SSL" olhando esse cabeçalho) sem custo nenhum.
#
# ⚠️ SOBRE O CUTOVER (transição do Keycloak antigo para o novo):
#   Enquanto você estiver testando, os dois podem rodar ao mesmo tempo
#   (portas diferentes na mesma VM: 18443 o antigo, 80 o novo via K3s) —
#   sem conflito de porta. Mas rodando os dois juntos, a VM de 8GB fica
#   disputando RAM entre o Keycloak antigo (Docker/bare-metal) e o novo
#   (2 réplicas no K3s). Depois de validar que o novo está funcionando
#   bem, pare os containers do Keycloak antigo (ex.: `docker compose down`
#   no diretório do setup.sh atual) antes de considerar a migração
#   definitiva — só assim a RAM é liberada de verdade.
# ==============================================================================

proxy_cache_path /www/wwwroot/sso.rondonopolis.mt.gov.br/proxy_cache_dir levels=1:2 keys_zone=sso_rondonopolis_mt_gov_br_cache:20m inactive=1d max_size=5g;

server {
    listen 80;

    listen 443 ssl http2 ;
    listen [::]:80;

    listen [::]:443 ssl http2 ;

    server_name sso.rondonopolis.mt.gov.br;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/sso.rondonopolis.mt.gov.br;
    include /www/server/panel/vhost/nginx/extension/sso.rondonopolis.mt.gov.br/*.conf;

    #CERT-APPLY-CHECK--START
    # Configuration related to file verification for SSL certificate application - Do not delete
    include /www/server/panel/vhost/nginx/well-known/sso.rondonopolis.mt.gov.br.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/sso.rondonopolis.mt.gov.br/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/sso.rondonopolis.mt.gov.br/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END
    #REDIRECT START

    #REDIRECT END

    #ERROR-PAGE-START  Error page configuration, allowed to be commented, deleted or modified
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP reference configuration, can be annotated or modified

    include enable-php-00.conf;
    #PHP-INFO-END

    #IP-RESTRICT-START Restrict access to IP configuration, IP blacklist and whitelist


    #IP-RESTRICT-END

    #BASICAUTH START

    #BASICAUTH END

    #SUB_FILTER START

    #SUB_FILTER END

    #GZIP START

    #GZIP END

    #GLOBAL-CACHE START

    location ~ .*\.(css|js|jpe?g|gif|png|webp|woff|eot|ttf|svg|ico|css\.map|js\.map)$
    {
        expires 1d;
        error_log /dev/null;
        access_log /dev/null;
    }
    #GLOBAL-CACHE END

    #WEBSOCKET-SUPPORT START
    proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    #WEBSOCKET-SUPPORT END

    #PROXY-CONF-START
    location ^~ / {

    proxy_pass http://192.168.0.225:80;
    # ALTERADO: era :18443 (Keycloak antigo) -> agora :80 (Traefik do K3s).

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Real-Port $remote_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # NOVO: avisa o Keycloak (via Traefik) que a conexão original foi HTTPS.
    proxy_set_header X-Forwarded-Host $host;
    # NOVO: preserva o domínio original visto pelo usuário.

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    }

    #PROXY-CONF-END

    #SERVER-BLOCK START

    #SERVER-BLOCK END

    #Prohibited access to files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #One click application for SSL certificate verification directory related settings
    location /.well-known{
        allow all;
        root /www/wwwroot/sso.rondonopolis.mt.gov.br;
    }

    #Prohibit placing sensitive files in the certificate verification directory
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    #LOG START
    access_log  /www/wwwlogs/sso.rondonopolis.mt.gov.br.log;
    error_log  /www/wwwlogs/sso.rondonopolis.mt.gov.br.error.log;

    #LOG END
}
