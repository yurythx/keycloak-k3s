# ==============================================================================
# ARQUIVO DE REFERÊNCIA (não aplicado via kubectl): nginx-edge/sso.rondonopolis.mt.gov.br.conf
# ------------------------------------------------------------------------------
# Copie/adapte este bloco para dentro da configuração já existente do seu
# Nginx da borda (ex.: /etc/nginx/sites-available/sso.rondonopolis.mt.gov.br.conf
# + link simbólico em sites-enabled/, ou direto em conf.d/ — siga o padrão
# que vocês já usam para os outros serviços atrás desse Nginx).
#
# PAPEL DESTE SERVIDOR: termina o TLS (guarda o certificado real) e repassa
# a requisição, já em HTTP puro, para o Traefik dentro do cluster K3s, que
# então encaminha para o Keycloak com base no cabeçalho Host.
# ==============================================================================

# ------------------------------------------------------------------------------
# Bloco 1: redireciona HTTP (porta 80) para HTTPS (porta 443).
# ------------------------------------------------------------------------------
server {
    listen 80;
    # ↑ Escuta conexões HTTP puro (porta 80) vindas da internet.
    listen [::]:80;
    # ↑ Mesma coisa, mas para IPv6.

    server_name sso.rondonopolis.mt.gov.br;
    # ↑ Este bloco só responde para requisições com este domínio no
    #   cabeçalho Host — necessário se o Nginx atende vários domínios.

    return 301 https://$host$request_uri;
    # ↑ Redireciona PERMANENTEMENTE (301) qualquer acesso HTTP para a
    #   versão HTTPS do mesmo caminho — o login de uma prefeitura nunca
    #   deve aceitar tráfego não criptografado.
}

# ------------------------------------------------------------------------------
# Bloco 2: termina o TLS e repassa para o Traefik dentro do K3s.
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    # ↑ Escuta conexões HTTPS (porta 443) — este bloco é quem realmente
    #   decodifica o TLS usando o certificado abaixo.
    listen [::]:443 ssl;
    http2 on;
    # ↑ Habilita HTTP/2 (opcional, mas recomendado — melhora performance
    #   sem exigir nenhuma mudança do lado do Keycloak/Traefik).

    server_name sso.rondonopolis.mt.gov.br;

    # --- Certificado TLS (ajuste para o caminho real usado por vocês) -----
    ssl_certificate     /etc/letsencrypt/live/sso.rondonopolis.mt.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sso.rondonopolis.mt.gov.br/privkey.pem;
    # ↑ Se o certificado for gerenciado de outra forma (certbot com nome
    #   diferente, certificado da prefeitura emitido por outra CA, wildcard
    #   *.rondonopolis.mt.gov.br compartilhado entre vários vhosts, etc.),
    #   ajuste estes dois caminhos — o resto do arquivo não muda.

    # --- Proxy reverso para o Traefik dentro do K3s ------------------------
    location / {
        proxy_pass http://192.168.0.225:80;
        # ↑ IP interno real da VM do K3s. A porta é sempre 80 (HTTP puro)
        #   — é o Traefik, do lado de dentro, quem decide para qual
        #   serviço encaminhar, com base no cabeçalho Host repassado logo
        #   abaixo. Se a VM mudar de IP no futuro, ajuste só aqui.

        proxy_set_header Host $host;
        # ↑ CRÍTICO: repassa o domínio original (sso.rondonopolis.mt.gov.br)
        #   para o Traefik — é assim que ele sabe rotear para o Keycloak
        #   (ver a regra "host:" em k3s-cluster/ingress.yaml). Sem isso, o
        #   Traefik receberia o Host como o IP da própria VM e não
        #   encontraria nenhuma regra correspondente (erro 404).

        proxy_set_header X-Forwarded-Proto https;
        # ↑ CRÍTICO: avisa ao Keycloak (via Traefik) que a requisição
        #   ORIGINAL do usuário foi HTTPS, mesmo que este proxy esteja
        #   conversando com o Traefik em HTTP puro. Sem isso — e sem o
        #   Traefik configurado para confiar nele (ver
        #   k3s-cluster/traefik-trusted-headers.yaml) — o Keycloak gera
        #   links "http://" incorretos e pode entrar em loop de redirect.

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ↑ Preserva o domínio original e a cadeia de IPs de origem (para
        #   logs de auditoria corretos no Keycloak — importante num
        #   ambiente governamental, onde saber "quem fez login de onde"
        #   pode ser exigido).

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # ↑ Permite conexões WebSocket passarem pelo proxy sem erro —
        #   usado por alguns fluxos internos do Keycloak/console de admin.

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        # ↑ Evita que uma instabilidade momentânea na rede interna deixe a
        #   requisição "pendurada" indefinidamente no navegador do usuário.
    }
}
