# ==============================================================================
# ARQUIVO DE REFERÊNCIA (não aplicado via kubectl): nginx-edge/cofre.rondonopolis.mt.gov.br.conf
# ------------------------------------------------------------------------------
# Mesma lógica do arquivo sso.rondonopolis.mt.gov.br.conf, mas para o
# domínio do Vaultwarden. Copie/adapte para dentro da configuração já
# existente do seu Nginx da borda.
# ==============================================================================

# ------------------------------------------------------------------------------
# Bloco 1: redireciona HTTP (porta 80) para HTTPS (porta 443).
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name cofre.rondonopolis.mt.gov.br;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# Bloco 2: termina o TLS e repassa para o Traefik dentro do K3s.
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name cofre.rondonopolis.mt.gov.br;

    # --- Certificado TLS (ajuste para o caminho real usado por vocês) -----
    ssl_certificate     /etc/letsencrypt/live/cofre.rondonopolis.mt.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cofre.rondonopolis.mt.gov.br/privkey.pem;

    # --- Limite de tamanho de upload (Vaultwarden aceita anexos em itens) -
    client_max_body_size 525M;
    # ↑ O Vaultwarden, por padrão, aceita anexos de até ~500MB por item de
    #   cofre — sem aumentar este limite aqui, o Nginx bloquearia esses
    #   uploads ANTES mesmo de chegarem ao cluster, com erro 413.

    # --- Proxy reverso para o Traefik dentro do K3s ------------------------
    location / {
        proxy_pass http://192.168.0.225:80;
        # ↑ IP interno real da VM do K3s (o MESMO IP usado no arquivo do
        #   SSO — é a mesma VM, o Traefik quem separa por domínio).

        proxy_set_header Host $host;
        # ↑ CRÍTICO: sem isso, o Traefik não sabe rotear para o Vaultwarden
        #   (ver a regra "host:" em k3s-cluster/ingress.yaml).

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ↑ Mesma explicação do arquivo do SSO: informa ao Vaultwarden que
        #   a conexão original foi HTTPS.

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # ↑ ESSENCIAL aqui: o Vaultwarden usa WebSocket
        #   (WEBSOCKET_ENABLED=true, ver vaultwarden.yaml) para sincronizar
        #   os cofres em tempo real entre os dispositivos do usuário — sem
        #   este repasse de Upgrade/Connection, a sincronização cai para o
        #   modo de polling manual (funciona, mas fica lento).

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
