# ==============================================================================
# ARQUIVO DE REFERÊNCIA (não aplicado via kubectl): nginx-edge/cofre.rondonopolis.mt.gov.br.conf
# ------------------------------------------------------------------------------
# Esta é a config REAL que já roda no servidor Nginx (aaPanel/BT Panel,
# IP 192.168.0.218), copiada tal como está hoje — só com as linhas
# marcadas com "# ALTERADO:" / "# NOVO:" mudadas. Todo o resto (blocos de
# SSL, cache, redirect HTTP->HTTPS, log, marcadores do painel) foi mantido
# 100% igual ao original de propósito, para não interferir na forma como o
# aaPanel gerencia certificado/renovação deste site.
#
# Este domínio JÁ EXISTE — rodava um Vaultwarden bare-metal/Docker na
# porta 8081, na MESMA VM 192.168.0.225 que vai receber o K3s (mesmo
# padrão do sso.rondonopolis.mt.gov.br.conf, não é um site novo). Esse
# Vaultwarden antigo já foi desligado e removido (ambiente de teste/POC,
# sem dado real de produção) — sem necessidade de migração de dados.
#
# ⚠️ ATENÇÃO AO EDITAR PELO PAINEL: se depois de colar isto você usar a
# ferramenta gráfica "Proxy Reverso" do aaPanel nas configurações deste
# site, ELA VAI SOBRESCREVER o bloco entre #PROXY-CONF-START e
# #PROXY-CONF-END com a config gerada pela própria interface — os
# cabeçalhos X-Forwarded-Proto/X-Forwarded-Host e o client_max_body_size
# adicionados abaixo seriam perdidos nesse caso. Se precisar reconfigurar
# pela interface gráfica no futuro, reaplique esses ajustes depois.
#
# O QUE MUDOU EM RELAÇÃO AO QUE JÁ ESTAVA NO SERVIDOR:
#   1. proxy_pass: porta 8081 (Vaultwarden antigo, bare-metal) -> porta 80
#      (Traefik do K3s, que decide internamente para onde mandar com base
#      no Host). O IP continua o mesmo (192.168.0.225) porque o K3s está
#      sendo instalado NA MESMA VM que já hospedava o Vaultwarden antigo.
#   2. Adicionadas 2 linhas "# NOVO:" (X-Forwarded-Proto e
#      X-Forwarded-Host) — o Vaultwarden atual aparentemente funciona sem
#      elas, mas o Vaultwarden novo (no K3s) usa a variável DOMAIN para
#      gerar links, e esses cabeçalhos fecham qualquer ambiguidade.
#   3. Adicionada "# NOVO:" client_max_body_size 525M — NÃO EXISTIA no
#      arquivo original. O Vaultwarden aceita anexos de até ~500MB por
#      item de cofre; sem este limite, o Nginx usa o padrão dele (1MB) e
#      bloqueia anexos maiores ANTES de chegarem ao cluster, com erro 413.
#      Vale conferir se isso já não estava incomodando no Vaultwarden
#      atual também (é uma limitação preexistente, não introduzida pela
#      migração).
#
# NOTA: sem dado real de produção no Vaultwarden antigo — pode aplicar a
# troca de porta direto, sem plano de migração de dados.
# ==============================================================================

proxy_cache_path /www/wwwroot/cofre.rondonopolis.mt.gov.br/proxy_cache_dir levels=1:2 keys_zone=cofre_rondonopolis_mt_gov_br_cache:20m inactive=1d max_size=5g;
server {
    listen 80;
    listen 443 ssl http2 ;

    server_name cofre.rondonopolis.mt.gov.br;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/cofre.rondonopolis.mt.gov.br;
    include /www/server/panel/vhost/nginx/extension/cofre.rondonopolis.mt.gov.br/*.conf;

    #CERT-APPLY-CHECK--START
    # Configuration related to file verification for SSL certificate application - Do not delete
    include /www/server/panel/vhost/nginx/well-known/cofre.rondonopolis.mt.gov.br.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    if ($server_port !~ 443){
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/cofre.rondonopolis.mt.gov.br/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/cofre.rondonopolis.mt.gov.br/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END
    #REDIRECT START

    #REDIRECT END

    # NOVO — não existia no arquivo original: o Vaultwarden aceita anexos
    # de até ~500MB por item de cofre. Sem isso, o Nginx usa o padrão dele
    # (1MB) e bloqueia anexos maiores com erro 413.
    client_max_body_size 525M;

    #ERROR-PAGE-START  Error page configuration, allowed to be commented, deleted or modified
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP reference configuration, can be annotated or modified

    include enable-php-00.conf;
    #PHP-INFO-END

    #IP-RESTRICT-START Restrict access to IP configuration, IP blacklist and whitelist

    #IP-RESTRICT-END

    #BASICAUTH START

    #BASICAUTH END

    #SUB_FILTER START

    #SUB_FILTER END

    #GZIP START

    #GZIP END

    #GLOBAL-CACHE START

    #GLOBAL-CACHE END

    #WEBSOCKET-SUPPORT START
    proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    #WEBSOCKET-SUPPORT END

    #PROXY-CONF-START
    location ^~ / {


      proxy_pass http://192.168.0.225:80;
      # ALTERADO: era :8081 (Vaultwarden antigo) -> agora :80 (Traefik do K3s).
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Real-Port $remote_port;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header REMOTE-HOST $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      # NOVO: avisa o Vaultwarden que a conexão original foi HTTPS.
      proxy_set_header X-Forwarded-Host $host;
      # NOVO: preserva o domínio original visto pelo usuário.

      proxy_connect_timeout 60s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # ↑ ESSENCIAL: o Vaultwarden usa WebSocket para sincronizar os cofres
      #   em tempo real entre os dispositivos do usuário
      #   (WEBSOCKET_ENABLED=true, ver k3s-cluster/vaultwarden.yaml).





    }
    #PROXY-CONF-END

    #SERVER-BLOCK START

    #SERVER-BLOCK END

    #Prohibited access to files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #One click application for SSL certificate verification directory related settings
    location /.well-known{
        allow all;
        root /www/wwwroot/cofre.rondonopolis.mt.gov.br;
    }

    #Prohibit placing sensitive files in the certificate verification directory
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    #LOG START
    access_log  /www/wwwlogs/cofre.rondonopolis.mt.gov.br.log;
    error_log  /www/wwwlogs/cofre.rondonopolis.mt.gov.br.error.log;

    #LOG END
}
