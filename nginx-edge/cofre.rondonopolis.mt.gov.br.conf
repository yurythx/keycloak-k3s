# ==============================================================================
# ARQUIVO DE REFERÊNCIA (não aplicado via kubectl): nginx-edge/cofre.rondonopolis.mt.gov.br.conf
# ------------------------------------------------------------------------------
# Diferente do sso.rondonopolis.mt.gov.br (que já existe), este domínio é
# NOVO — não existia vhost nenhum pra ele antes do Vaultwarden. Por isso o
# fluxo recomendado é:
#
#   1. No aaPanel: Website -> Add site -> domínio
#      "cofre.rondonopolis.mt.gov.br" (cria o docroot e o esqueleto do
#      vhost, com os mesmos marcadores #SSL-START, #PROXY-CONF-START, etc.
#      que o sso.rondonopolis.mt.gov.br.conf já tem).
#   2. Na aba SSL desse site, peça o certificado Let's Encrypt pelo próprio
#      painel (mesmo processo já usado no sso.rondonopolis.mt.gov.br) — ele
#      preenche sozinho ssl_certificate/ssl_certificate_key com os
#      caminhos corretos para ESTE domínio.
#   3. Aba "Proxy Reverso" (ou editando o arquivo direto, como abaixo):
#      configure o alvo como http://192.168.0.225:80 e adicione os
#      cabeçalhos extras que o Vaultwarden precisa (marcados "NOVO:"
#      abaixo) — o painel sozinho não adiciona X-Forwarded-Proto nem o
#      client_max_body_size maior para anexos.
#
# O arquivo abaixo é a PREVISÃO de como o painel vai gerar o esqueleto
# (mesmo padrão do sso.rondonopolis.mt.gov.br.conf, só trocando o domínio),
# já com os ajustes do Vaultwarden aplicados — use como referência para
# conferir/completar o que o painel criar, em vez de colar por cima às
# cegas (os caminhos de certificado só existem de verdade depois do passo 2).
# ==============================================================================

proxy_cache_path /www/wwwroot/cofre.rondonopolis.mt.gov.br/proxy_cache_dir levels=1:2 keys_zone=cofre_rondonopolis_mt_gov_br_cache:20m inactive=1d max_size=5g;

server {
    listen 80;

    listen 443 ssl http2 ;
    listen [::]:80;

    listen [::]:443 ssl http2 ;

    server_name cofre.rondonopolis.mt.gov.br;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/cofre.rondonopolis.mt.gov.br;
    include /www/server/panel/vhost/nginx/extension/cofre.rondonopolis.mt.gov.br/*.conf;

    #CERT-APPLY-CHECK--START
    # Configuration related to file verification for SSL certificate application - Do not delete
    include /www/server/panel/vhost/nginx/well-known/cofre.rondonopolis.mt.gov.br.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/cofre.rondonopolis.mt.gov.br/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/cofre.rondonopolis.mt.gov.br/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END

    # NOVO — não vem por padrão no esqueleto do painel: o Vaultwarden
    # aceita anexos de até ~500MB por item de cofre. Sem isso, o Nginx
    # bloqueia esses uploads ANTES de chegarem ao cluster, com erro 413.
    client_max_body_size 525M;

    #WEBSOCKET-SUPPORT START
    proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    #WEBSOCKET-SUPPORT END

    #PROXY-CONF-START
    location ^~ / {

    proxy_pass http://192.168.0.225:80;
    # Mesma VM do K3s, porta 80 — o Traefik decide internamente que este
    # domínio vai para o Service "vaultwarden" (ver k3s-cluster/ingress.yaml).

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Real-Port $remote_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # NOVO: avisa o Vaultwarden que a conexão original foi HTTPS.
    proxy_set_header X-Forwarded-Host $host;
    # NOVO: preserva o domínio original visto pelo usuário.

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    # ↑ Mesmos timeouts generosos usados no sso — ajudam também no upload
    #   de anexos grandes no Vaultwarden.

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # ↑ ESSENCIAL aqui: o Vaultwarden usa WebSocket para sincronizar os
    #   cofres em tempo real entre os dispositivos do usuário
    #   (WEBSOCKET_ENABLED=true, ver k3s-cluster/vaultwarden.yaml).
    }

    #PROXY-CONF-END

    #Prohibited access to files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #One click application for SSL certificate verification directory related settings
    location /.well-known{
        allow all;
        root /www/wwwroot/cofre.rondonopolis.mt.gov.br;
    }

    #Prohibit placing sensitive files in the certificate verification directory
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    #LOG START
    access_log  /www/wwwlogs/cofre.rondonopolis.mt.gov.br.log;
    error_log  /www/wwwlogs/cofre.rondonopolis.mt.gov.br.error.log;

    #LOG END
}
