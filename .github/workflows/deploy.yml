# ==============================================================================
# ARQUIVO: .github/workflows/deploy.yml
# ------------------------------------------------------------------------------
# OBJETIVO
#   Pipeline de GitOps: toda vez que um commit chega na branch "main", este
#   workflow se conecta ao Runner AUTO-HOSPEDADO (instalado dentro da própria
#   VM do K3s) e aplica os manifestos do Kubernetes NA ORDEM CORRETA.
#
# POR QUE SELF-HOSTED RUNNER (E NÃO O RUNNER PADRÃO DA GITHUB)?
#   Os runners padrão do GitHub ("ubuntu-latest") rodam em máquinas efêmeras
#   NA NUVEM da GitHub — para eles conseguirem aplicar manifestos no nosso
#   K3s, precisaríamos expor a API do Kubernetes (porta 6443) ou o SSH da VM
#   para a internet, o que é um risco de segurança inaceitável para uma
#   stack de autenticação governamental.
#
#   Com um runner SELF-HOSTED, o agente do GitHub Actions roda DENTRO da
#   própria VM e é ELE quem inicia uma conexão de SAÍDA (outbound) para os
#   servidores da GitHub buscar trabalho — nenhuma porta de entrada
#   (inbound) precisa ser aberta no firewall da prefeitura. É o runner que
#   "puxa" o trabalho, e não a GitHub que "empurra" para dentro da rede.
#
# 🔒 SOBRE O ESCOPO DE PERMISSÃO DO RUNNER (auditoria ago/2026)
#   O runner roda como o usuário `dti` (não-root) e usa uma ServiceAccount
#   dedicada (`gha-deployer`, criada fora deste repositório — ver runbook
#   na seção 8 do README) com RBAC escopado APENAS ao namespace
#   `authentication` (mais permissão para gerenciar a própria Namespace e
#   a StorageClass/ClusterRole de cluster-admin do Portainer, que também
#   são recursos de escopo de cluster que este pipeline precisa criar/
#   atualizar). Antes desta auditoria, o runner usava o kubeconfig admin
#   completo do K3s (`/etc/rancher/k3s/k3s.yaml`), com `cluster-admin`
#   sobre o cluster INTEIRO — um comprometimento do pipeline (ou de uma
#   Action de terceiro, se algum dia uma for adicionada) equivalia a
#   controle total do cluster, não só desta stack.
# ==============================================================================

name: Deploy Auth Stack para o K3s
# ↑ Nome do workflow, exibido na aba "Actions" do repositório no GitHub.

"on":
  # ↑ Bloco que define QUANDO este workflow deve ser disparado.
  #   (Colocado entre aspas de propósito: em YAML 1.1 a palavra "on" sem
  #   aspas pode ser interpretada como o booleano `true` por alguns parsers
  #   estritos — o GitHub Actions lida bem com ambas as formas, mas aspas
  #   aqui removem qualquer ambiguidade para outras ferramentas de lint.)
  push:
    branches:
      - main
      # ↑ Só executa em PUSH (commit direto ou merge de PR) na branch
      #   "main" — é o gatilho clássico de GitOps: "main" é sempre o
      #   reflexo fiel do que está rodando em produção.
    paths:
      - "k3s-cluster/**"
      # ↑ Só dispara se algum arquivo dentro de "k3s-cluster/" mudar...
      - ".github/workflows/deploy.yml"
      # ↑ ...ou se o próprio workflow for alterado. Evita rodar o deploy à
      #   toa quando, por exemplo, só o README.md é editado.

  workflow_dispatch:
    # ↑ Permite também disparar este workflow MANUALMENTE pela interface do
    #   GitHub (botão "Run workflow") ou via `gh workflow run deploy.yml` —
    #   útil para reaplicar os manifestos sem precisar de um commit novo
    #   (ex.: depois de trocar uma senha diretamente no cluster por engano).

concurrency:
  group: deploy-producao
  # ↑ Agrupa todas as execuções deste workflow sob a mesma "fila" chamada
  #   "deploy-producao" — o GitHub nunca deixa 2 execuções deste grupo
  #   rodarem ao mesmo tempo, independente do valor de cancel-in-progress
  #   abaixo (isso sozinho já evita dois `kubectl apply` brigando pelo
  #   mesmo cluster simultaneamente).
  cancel-in-progress: true
  # ↑ Se um push novo chegar enquanto OUTRO deploy anterior ainda está
  #   rodando (ou apenas enfileirado, esperando um runner ficar livre), o
  #   mais antigo é CANCELADO na hora, e só o mais recente prossegue.
  #   IMPORTANTE: já vivemos o cenário oposto (cancel-in-progress: false)
  #   na prática — o runner ficou offline por um tempo enquanto vários
  #   commits eram enviados, e quando finalmente entrou no ar, processou
  #   TODOS os deploys enfileirados em sequência, do mais antigo (com
  #   manifestos já desatualizados) até o mais novo, desperdiçando minutos
  #   reaplicando estados intermediários que nem interessam mais — o
  #   `kubectl apply` sendo idempotente torna seguro simplesmente pular
  #   direto para o estado mais recente.

permissions:
  contents: read
  # ↑ O workflow só precisa de permissão de LEITURA sobre o código do
  #   repositório (para fazer checkout) — Princípio do Menor Privilégio.
  #   Não escrevemos nada de volta no repositório, então não concedemos
  #   permissão de escrita ao GITHUB_TOKEN automático.

jobs:
  # ↑ Um workflow é composto por um ou mais "jobs" (tarefas independentes).
  #   Temos apenas um job aqui: aplicar os manifestos no cluster.

  aplicar-manifestos:
    # ↑ Identificador interno deste job (aparece nos logs e na URL da execução).

    runs-on: self-hosted
    # ↑ ⭐ O CORAÇÃO DA SEGURANÇA DESTE PIPELINE ⭐
    #   Em vez de "ubuntu-latest" (máquina da GitHub), usamos "self-hosted"
    #   para rodar este job DENTRO da própria VM K3s da prefeitura — o
    #   `kubectl` já está local, autenticado no cluster local (hoje, via um
    #   kubeconfig escopado ao namespace `authentication` — ver nota de
    #   segurança no cabeçalho deste arquivo), sem precisar trafegar
    #   credenciais de acesso pela internet. (Veja o README.md para o
    #   passo a passo de registro do runner.)

    timeout-minutes: 20
    # ↑ Mata o job automaticamente se travar além deste tempo — evita que
    #   uma pipeline "pendurada" bloqueie a fila de deploys para sempre.
    #   Precisa ser MAIOR que a SOMA dos timeouts de todos os `kubectl wait`
    #   individuais abaixo no pior caso (postgres 120s + keycloak 300s +
    #   vaultwarden 120s + federação com o AD 300s = 840s ≈ 14min), senão
    #   este teto geral mata a pipeline ANTES de um passo individual sequer
    #   ter chance de reportar seu próprio erro — ajustado de 10 para 20min
    #   quando o timeout do passo de federação subiu de 120s para 300s (ver
    #   comentário no passo de federação, mais abaixo).

    steps:
      # ↑ Lista ORDENADA de passos executados sequencialmente dentro do job.
      #   Se qualquer passo falhar (exit code != 0), os passos seguintes NÃO
      #   rodam e o workflow inteiro é marcado como falho.

      - name: 1. Fazer checkout do código-fonte
        uses: actions/checkout@v4
        # ↑ Ação oficial da GitHub que clona o repositório (na revisão exata
        #   do commit que disparou o workflow) para dentro do workspace
        #   local do runner self-hosted, para que os arquivos .yaml existam
        #   fisicamente em disco e possam ser lidos pelo `kubectl apply`.

      - name: 2. Validar acesso ao cluster K3s
        run: kubectl cluster-info
        # ↑ Passo de sanidade: confirma que o runner consegue "enxergar" o
        #   cluster ANTES de tentar aplicar qualquer coisa. Se o K3s
        #   estiver fora do ar ou o kubeconfig estiver mal configurado no
        #   runner, o pipeline falha AQUI, com uma mensagem de erro clara,
        #   em vez de falhar de forma confusa nos passos seguintes.

      - name: 3. Aplicar Namespace
        run: kubectl apply -f k3s-cluster/namespaces.yaml
        # ↑ SEMPRE o primeiro manifesto: cria o namespace "authentication"
        #   onde todos os demais recursos vão residir. Se este passo não
        #   rodar primeiro, os passos seguintes falham com erro
        #   "namespaces authentication not found".

      - name: 4. Aplicar StorageClass (local-path-retain)
        run: kubectl apply -f k3s-cluster/storageclass.yaml
        # ↑ 🔒 Passo novo (auditoria ago/2026). Recurso de escopo de
        #   CLUSTER (não fica dentro de nenhum namespace), por isso é
        #   aplicado cedo, junto com o Namespace — antes de qualquer PVC
        #   que possa vir a usá-la (hoje, só `vaultwarden-backup-pvc`; ver
        #   `storageclass.yaml` para o porquê dos 3 PVCs mais antigos não
        #   usarem esta classe).

      - name: 5. Aplicar ResourceQuota e LimitRange do namespace
        run: kubectl apply -f k3s-cluster/resource-quota.yaml
        # ↑ 🔒 Passo novo (auditoria ago/2026). Aplicado cedo, antes de
        #   qualquer Deployment/Job existir no namespace — não bloqueia
        #   nada retroativamente (a ResourceQuota só entra em vigor para
        #   objetos criados A PARTIR de agora), mas já protege os passos
        #   seguintes deste mesmo deploy.

      - name: 6. Aplicar Secrets (credenciais)
        run: kubectl apply -f k3s-cluster/secrets.yaml
        # ↑ Aplicado logo em seguida, pois o PostgreSQL, o Keycloak e o
        #   Vaultwarden (próximos passos) dependem destas credenciais via
        #   `secretKeyRef` para conseguirem sequer INICIAR.

      - name: 7. Aplicar PostgreSQL (PVC + Deployment + Service)
        run: kubectl apply -f k3s-cluster/postgres-db.yaml
        # ↑ O arquivo postgres-db.yaml já contém o PVC (disco), o Deployment
        #   e o Service num único apply — o Kubernetes cria os 3 objetos na
        #   ordem correta internamente (PVC antes do Pod que o consome).

      - name: 8. Aguardar o PostgreSQL ficar pronto
        run: |
          kubectl rollout status deployment/postgres \
            -n authentication --timeout=120s
        # ↑ `rollout status` BLOQUEIA a pipeline até o Deployment do
        #   Postgres reportar todas as réplicas prontas (readinessProbe OK)
        #   — ou falhar após 120s. Fundamental: subir o Keycloak ANTES do
        #   banco estar realmente pronto faria os Pods dele entrarem em
        #   CrashLoopBackOff nas primeiras tentativas de conexão.

      - name: 9. Aplicar NetworkPolicy de Ingress (restringe acesso ao Postgres)
        run: kubectl apply -f k3s-cluster/network-policy.yaml
        # ↑ Aplicado logo após o Postgres existir, e ANTES do Keycloak, para
        #   que a regra "só o Keycloak pode falar com o banco" já esteja no
        #   lugar assim que o primeiro Pod do Keycloak tentar se conectar.
        #   (Funciona em qualquer K3s — ver aviso sobre CNI/enforcement
        #   dentro do próprio arquivo network-policy.yaml.)

      - name: 10. Aplicar NetworkPolicy de Egress (restringe saída de cada Pod)
        run: kubectl apply -f k3s-cluster/network-policy-egress.yaml
        # ↑ 🔒 Passo novo (auditoria ago/2026) — ver
        #   `network-policy-egress.yaml` para o racional completo de cada
        #   regra e o aviso sobre por que a regra de DNS é obrigatória em
        #   toda policy. Aplicado junto com a policy de Ingress, pelo mesmo
        #   motivo: o Postgres (alvo das regras de egress mais simples) já
        #   existe neste ponto da pipeline.

      - name: 11. Aplicar CronJob de backup do PostgreSQL
        run: kubectl apply -f k3s-cluster/postgres-backup-cronjob.yaml
        # ↑ Cria o PVC dedicado de backup e agenda o `pg_dump` diário às
        #   03:00 (America/Cuiaba). Aplicado aqui pois já depende do
        #   Secret (passo 6) para as credenciais de conexão, e é
        #   independente do Keycloak/Vaultwarden em si.

      - name: 12. Aplicar tema visual customizado do Keycloak (ConfigMap)
        run: kubectl apply -f k3s-cluster/keycloak-theme.yaml
        # ↑ ANTES do Deployment do Keycloak (próximo passo) de propósito:
        #   o Deployment monta este ConfigMap como volume — se ele não
        #   existir ainda, os Pods ficam travados em "ContainerCreating"
        #   esperando um volume inexistente.

      - name: 13. Aplicar Keycloak (Service headless + Deployment + Services)
        run: kubectl apply -f k3s-cluster/keycloak.yaml
        # ↑ Cria o Service headless (usado pelo DNS_PING para o clustering
        #   entre as 2 réplicas), o Deployment do Keycloak (já apontando
        #   para o Postgres, garantido pronto no passo 8, e para o tema
        #   customizado do passo anterior), o Service ClusterIP interno E
        #   o Service LoadBalancer que expõe a porta 18443 na VM — a MESMA
        #   porta que o Keycloak antigo usava, para o Nginx da borda não
        #   precisar de nenhuma alteração de config (ver `nginx-edge/README.md`).

      - name: 14. Aplicar Vaultwarden (PVC + Deployment + Services)
        run: kubectl apply -f k3s-cluster/vaultwarden.yaml
        # ↑ Mesmo raciocínio do Keycloak: inclui o Service LoadBalancer que
        #   expõe a porta 8081 na VM, a mesma porta que o Vaultwarden
        #   antigo já usava.

      - name: 15. Aplicar CronJob de backup do Vaultwarden
        run: kubectl apply -f k3s-cluster/vaultwarden-backup-cronjob.yaml
        # ↑ 🔒 Passo novo (auditoria ago/2026) — ver
        #   `vaultwarden-backup-cronjob.yaml`. Precisa vir DEPOIS do passo
        #   anterior (Vaultwarden), pois monta o mesmo PVC (`vaultwarden-pvc`)
        #   criado por ele, em modo somente leitura.

      - name: 16. Aguardar Keycloak e Vaultwarden ficarem prontos
        run: |
          kubectl rollout status deployment/keycloak \
            -n authentication --timeout=300s
          kubectl rollout status deployment/vaultwarden \
            -n authentication --timeout=120s
        # ↑ O Keycloak pode demorar para subir na primeira execução (cria o
        #   schema do banco e o Master Realm) e, como usamos
        #   maxUnavailable=0/maxSurge=1, uma troca de imagem/config faz as
        #   2 réplicas serem substituídas uma de cada vez — cada uma leva
        #   ~60-90s só na fase de "augmentation" do Quarkus (visto na
        #   prática rodando o primeiro deploy real). 300s dá margem
        #   confortável para as 2 réplicas trocarem sem falso-negativo
        #   (o Deployment fica saudável de qualquer forma, mesmo se este
        #   passo estourar o tempo — é só a CONFIRMAÇÃO da pipeline que
        #   ficaria imprecisa com um timeout curto demais).

      - name: 17. Configurar federação com o Active Directory
        run: |
          if ! kubectl get secret ad-bind-credentials -n authentication > /dev/null 2>&1; then
            echo "AVISO: Secret 'ad-bind-credentials' ainda não existe."
            echo "Passo pulado sem falhar o deploy do restante da stack."
            echo "Crie-o manualmente (ver cabecalho de k3s-cluster/ldap-federation-job.yaml)"
            echo "e rode este workflow novamente para ativar a federacao com o AD."
            exit 0
          fi
          if ! kubectl get secret keycloak-admin-credentials -n authentication > /dev/null 2>&1; then
            echo "AVISO: Secret 'keycloak-admin-credentials' ainda não existe."
            echo "Passo pulado sem falhar o deploy do restante da stack."
            echo "Crie-o manualmente (ver comentário de KC_ADMIN_PASSWORD em"
            echo "k3s-cluster/ldap-federation-job.yaml) e rode este workflow de novo."
            exit 0
          fi
          kubectl delete job ldap-federation-setup -n authentication --ignore-not-found
          kubectl apply -f k3s-cluster/ldap-federation-job.yaml
          if ! kubectl wait --for=condition=complete --timeout=300s \
            job/ldap-federation-setup -n authentication; then
            echo "ERRO: o Job de federação com o AD não completou a tempo (ou falhou de verdade)."
            echo "----- Logs do Job (últimas 50 linhas) -----"
            kubectl logs -n authentication job/ldap-federation-setup --tail=50
            exit 1
          fi
        # ↑ 🐛 `--timeout=300s` (ANTES: 120s) — bug real encontrado ao vivo
        #   assim que o `exit 1` acima entrou em produção pela primeira vez:
        #   o Job de federação, em execução real (sync de grupos do AD pela
        #   rede + Keycloak ainda subindo), leva de fato ~3-4 minutos para
        #   completar — mais que os 120s antigos. O `kubectl wait` estourava
        #   o timeout e a pipeline falhava com "ERRO: ... não completou a
        #   tempo", MESMO com o Job terminando com sucesso segundos depois
        #   por conta própria. Esse timeout curto sempre existiu, mas antes
        #   ficava mascarado pelo bug do `kubectl wait \|\| kubectl logs`
        #   (ver a seção 8 do README) — corrigir um escondia o outro. 300s
        #   alinha com o `activeDeadlineSeconds: 300` já definido no
        #   próprio `ldap-federation-job.yaml` (o teto real que o Job se dá
        #   antes de ser morto), então os dois números agora contam a
        #   mesma história.
        # ↑ Este passo é TOLERANTE só a UM tipo específico de "falha": os
        #   Secrets `ad-bind-credentials` e `keycloak-admin-credentials`
        #   ainda não existirem (checado acima, com `exit 0`) — porque os
        #   dois dependem de um passo manual único, fora do Git (ver aviso
        #   no topo de ldap-federation-job.yaml). Depois que
        #   o Job É de fato criado, uma falha REAL dele (script quebrado, AD
        #   fora do ar, etc.) PRECISA derrubar este passo com `exit 1` — a
        #   versão anterior deste comando (`kubectl wait ... || kubectl logs
        #   ...`) tinha um bug sutil: `kubectl logs` quase sempre funciona
        #   mesmo para um Job que falhou, então o `||` fazia esse comando
        #   "engolir" o erro e o passo terminava em sucesso (verde) mesmo
        #   quando a federação com o AD estava genuinamente quebrada —
        #   escondendo o problema tanto do painel do GitHub Actions quanto
        #   de qualquer alerta baseado em falha de pipeline. Agora, o passo
        #   final (que roda sempre, via `if: always()`) ainda mostra o
        #   estado final do cluster para diagnóstico, mas o workflow como um
        #   todo fica corretamente marcado como FALHO quando isso acontece.
        #   `kubectl delete` antes do `apply`: Jobs do Kubernetes são
        #   IMUTÁVEIS depois de criados — sem apagar primeiro, reaplicar um
        #   Job já existente com o mesmo nome falharia. Apagar e recriar a
        #   cada deploy garante que mudanças neste arquivo (ou rotação da
        #   senha do AD) sejam reaplicadas automaticamente — a lógica
        #   interna do Job é idempotente (verifica antes de criar), então
        #   rodar de novo em todo deploy é seguro e não duplica nada.

      - name: 18. Aplicar Portainer (namespace, RBAC, Deployment, Service)
        run: kubectl apply -f k3s-cluster/portainer.yaml
        # ↑ 🔒 Passo novo (auditoria ago/2026) — Portainer já rodava no
        #   cluster desde antes, aplicado manualmente; movido para dentro
        #   do GitOps nesta auditoria (ver cabeçalho de `portainer.yaml`
        #   para o porquê e as duas mudanças de segurança feitas em cima
        #   do manifesto oficial). Independente do resto da stack de
        #   autenticação — colocado por último de propósito, para uma
        #   eventual falha aqui nunca impedir o Keycloak/Postgres/
        #   Vaultwarden (o que realmente importa) de serem atualizados.

      - name: 19. Resumo final do estado do cluster
        if: always()
        # ↑ `if: always()` faz este passo rodar SEMPRE, mesmo se algum passo
        #   anterior tiver falhado — útil para diagnóstico rápido direto
        #   nos logs da GitHub Actions, sem precisar acessar a VM via SSH.
        run: |
          echo "----- Pods no namespace authentication -----"
          kubectl get pods -n authentication -o wide
          echo "----- Services no namespace authentication (confira as portas 18443/8081) -----"
          kubectl get svc -n authentication -o wide
          echo "----- CronJobs de backup -----"
          kubectl get cronjob -n authentication
          echo "----- Portainer -----"
          kubectl get pods -n portainer -o wide
